<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FinVision — Understand Before You Invest</title>
<meta name="description" content="FinVision: Explainable structured-product suitability platform. Understand structured financial products before you invest.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>
(function(){
  function loadScript(src,cb){var s=document.createElement('script');s.src=src;s.onload=cb;s.onerror=function(){if(cb)cb();};document.head.appendChild(s);}
  loadScript('/plotly.min.js',function(){
    if(typeof Plotly==='undefined')loadScript('https://cdn.plot.ly/plotly-2.35.2.min.js',function(){window._plotlyReady=true;document.dispatchEvent(new Event('plotlyready'))});
    else{window._plotlyReady=true;document.dispatchEvent(new Event('plotlyready'));}
  });
})();
</script>
<style>
:root {
  --bg: #ecf3ff;
  --bg-2: #dfeafe;
  --surface: rgba(255,255,255,0.80);
  --card: #ffffff;
  --ink: #0d1f3d;
  --ink2: #30476d;
  --mut: #647899;
  --line: rgba(123, 144, 181, 0.22);
  --pri: #123ea6;
  --pri-2: #1d4ed8;
  --pri-3: #2563eb;
  --pri-l: #edf4ff;
  --ok: #0f766e;
  --ok-l: #dcfdf7;
  --rev: #b45309;
  --rev-l: #fff5d6;
  --bad: #b91c1c;
  --bad-l: #ffe4e6;
  --navy-900: #071a38;
  --navy-800: #0d224a;
  --navy-700: #12356a;
  --navy-100: #edf5ff;
  --panel-glow: rgba(97, 127, 255, 0.18);
  --nav-w: 230px;
  --header-h: 68px;
  --shadow-soft: 0 20px 60px rgba(11, 22, 45, 0.16);
  --shadow-card: 0 16px 32px rgba(13, 31, 61, 0.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html { scroll-behavior:smooth }
body{
  font-family:'Inter',system-ui,sans-serif;
  background:
    radial-gradient(circle at top left, rgba(37,99,235,0.18), transparent 28%),
    radial-gradient(circle at bottom right, rgba(16,185,129,0.10), transparent 26%),
    linear-gradient(180deg, #edf4ff 0%, #edf1fb 100%);
  color:var(--ink);font-size:14px;line-height:1.5
}

/* ── Login ── */
#login-screen {
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at top, rgba(255,255,255,0.18), transparent 28%), linear-gradient(135deg,#071a38 0%,#0d224a 28%,#163f9d 100%);
  padding:24px;
}
.login-box {
  background:rgba(255,255,255,0.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,0.22);border-radius:28px;padding:34px 32px;width:100%;max-width:470px;
  box-shadow:0 30px 80px rgba(2,6,23,0.38);
}
.login-logo { text-align:center;margin-bottom:22px }
.login-logo .logo-name { font-size:30px;font-weight:800;color:var(--pri);letter-spacing:-0.7px }
.login-logo .logo-tagline { font-size:13px;color:var(--mut);margin-top:4px }
.login-tabs { display:flex;gap:8px;margin-bottom:24px;padding:4px;background:#edf4ff;border-radius:12px }
.login-tab { flex:1;padding:11px 10px;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;font:600 13px 'Inter',sans-serif;color:var(--mut);transition:.18s ease }
.login-tab.active { border-color:rgba(30,64,175,0.18);color:var(--pri);background:#fff;box-shadow:0 8px 18px rgba(37,99,235,0.10) }
.login-field label { display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:7px }
.login-field input { width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;font-size:14px;outline:none;transition:.15s;background:#f7faff }
.login-field input:focus { border-color:rgba(37,99,235,0.55);box-shadow:0 0 0 4px rgba(37,99,235,0.08) }
.login-field { margin-bottom:14px }
.btn-login { width:100%;padding:14px 18px;background:linear-gradient(135deg,var(--pri-2),var(--pri));color:#fff;border:0;border-radius:12px;font:700 16px 'Inter',sans-serif;cursor:pointer;margin-top:6px;transition:.15s;box-shadow:0 16px 28px rgba(30,64,175,0.24) }
.btn-login:hover { transform:translateY(-1px); background:linear-gradient(135deg,var(--pri),var(--pri-2)) }
.demo-creds { background:linear-gradient(180deg,#f7faff,#eef5ff);border:1px solid rgba(59,130,246,0.15);border-radius:12px;padding:12px 14px;margin-top:16px;font-size:12px }
.demo-creds b { color:var(--pri);display:block;margin-bottom:6px;font-size:12px }
.demo-creds span { color:var(--mut);line-height:1.6 }
.login-err { color:var(--bad);font-size:12px;margin-top:8px;display:none;font-weight:600 }

/* ── App Shell ── */
#app-shell { display:none;min-height:100vh }
.top-bar {
  position:fixed;top:0;left:0;right:0;height:var(--header-h);z-index:100;
  background:rgba(11,20,44,0.78);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(148,163,184,0.20);box-shadow:0 8px 22px rgba(15,23,42,0.10);display:flex;align-items:center;padding:0 22px;gap:16px;
}
.top-logo { font-size:17px;font-weight:800;color:#ffffff;letter-spacing:-0.4px;flex:0 0 auto }
.top-logo span { font-weight:400;color:rgba(255,255,255,0.72);font-size:12px;display:block;line-height:1.2 }
.top-bar-right { margin-left:auto;display:flex;align-items:center;gap:12px }
.top-user { font-size:13px;color:rgba(255,255,255,0.9);display:flex;align-items:center;gap:8px }
.role-badge { font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,0.12);color:#dfe9ff;border:1px solid rgba(255,255,255,0.12) }
.role-badge.customer { background:rgba(15,118,110,0.12);color:#d7fff7;border-color:rgba(15,118,110,0.18) }
.btn-icon { background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.10);border-radius:10px;cursor:pointer;padding:7px 11px;font-size:12px;color:#edf4ff;display:flex;align-items:center;gap:4px;transition:.15s }
.btn-icon:hover { background:rgba(255,255,255,0.12) }
.alert-bell { position:relative;cursor:pointer;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.10);border-radius:10px;padding:7px 11px }
.alert-count { position:absolute;top:-6px;right:-6px;background:linear-gradient(135deg,#ff6b6b,#dc2626);color:#fff;border-radius:999px;font-size:10px;font-weight:700;padding:2px 5px;min-width:16px;text-align:center;box-shadow:0 12px 18px rgba(220,38,38,0.2) }

/* ── Nav Sidebar ── */
.sidebar {
  position:fixed;top:var(--header-h);left:0;bottom:0;width:var(--nav-w);
  background:rgba(255,255,255,0.75);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-right:1px solid var(--line);overflow-y:auto;z-index:50;padding:12px 0;
}
.nav-section-label { font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;padding:12px 18px 6px }
.nav-item { display:flex;align-items:center;gap:10px;padding:11px 16px;margin:0 10px;border-radius:12px;cursor:pointer;color:var(--ink2);transition:.18s ease;font-size:13px;border:1px solid transparent; }
.nav-item:hover { background:rgba(37,99,235,0.06);color:var(--pri);transform:translateX(2px) }
.nav-item.active { background:linear-gradient(135deg, rgba(17, 81, 206, 0.12), rgba(30,64,175,0.08));color:var(--pri);font-weight:700;border-color:rgba(30,64,175,0.15);box-shadow:inset 0 0 0 1px rgba(30,64,175,0.06) }
.nav-item .nav-icon { width:16px;text-align:center;font-size:14px }

/* ── Main Content ── */
.main-content { margin-left:var(--nav-w);margin-top:var(--header-h);padding:26px 22px 40px;min-height:calc(100vh - var(--header-h));max-width:1600px }

/* ── Cards ── */
.card { background:linear-gradient(180deg, rgba(255,255,255,0.96), rgba(247,250,255,0.92));border:1px solid rgba(148,163,184,0.18);border-radius:22px;padding:18px 18px 16px;margin-bottom:16px;box-shadow:var(--shadow-card);transition:transform .15s ease, box-shadow .15s ease }
.card:hover { transform:translateY(-1px); box-shadow:0 18px 34px rgba(13,31,61,0.09) }
.card-title { font-size:13px;font-weight:700;color:var(--ink);margin-bottom:14px;display:flex;align-items:center;gap:8px }
.card-title .badge-sm { font-size:10px;font-weight:600;padding:3px 8px;border-radius:999px }
.grid-2 { display:grid;grid-template-columns:1fr 1fr;gap:16px }
.grid-3 { display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px }
.grid-4 { display:grid;grid-template-columns:repeat(4,1fr);gap:14px }

/* ── KPI Cards ── */
.kpi-shell {
  position:relative;
  border-radius:22px;
  padding:1px;
  background:linear-gradient(135deg, rgba(59,130,246,0.25), rgba(30,64,175,0.08), rgba(148,163,184,0.15));
  box-shadow:0 18px 40px rgba(17, 24, 39, 0.06);
  animation: floatCard 7s ease-in-out infinite;
  transition:transform .22s ease, box-shadow .22s ease;
}
.kpi-shell:nth-child(2n) { animation-delay:0.7s }
.kpi-shell:nth-child(3n) { animation-delay:1.2s }
.kpi-shell:hover { transform:translateY(-3px) scale(1.01); box-shadow:0 22px 45px rgba(30,64,175,0.12) }
.kpi-shell.dragging { z-index:10 }
.kpi {
  position:relative; overflow:hidden;
  background:linear-gradient(180deg,#ffffff,#f7faff);
  border:1px solid rgba(148,163,184,0.18);
  border-radius:20px;padding:16px 18px;box-shadow:0 10px 20px rgba(15,23,42,0.03);
  cursor:grab; user-select:none; transition:transform .18s ease, box-shadow .18s ease;
}
.kpi::before {
  content:''; position:absolute; inset:-40% auto auto -25%; width:55%; height:160%;
  background:linear-gradient(120deg, rgba(255,255,255,0.30), rgba(255,255,255,0.02), rgba(255,255,255,0.00));
  transform:rotate(18deg);
}
.kpi-label { font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.6px;position:relative;z-index:1 }
.kpi-value { font-size:26px;font-weight:800;color:var(--ink);margin-top:8px;letter-spacing:-0.8px;position:relative;z-index:1 }
.kpi-sub { font-size:12px;color:var(--mut);margin-top:2px;position:relative;z-index:1 }

@keyframes floatCard {
  0%,100% { transform:translateY(0px) }
  50% { transform:translateY(-4px) }
}

/* ── Status Badges ── */
.badge { display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700 }
.badge.SUITABLE { background:var(--ok-l);color:var(--ok) }
.badge.REVIEW { background:var(--rev-l);color:var(--rev) }
.badge.MISMATCH { background:var(--bad-l);color:var(--bad) }
.badge.INFO { background:#eff6ff;color:#1d4ed8 }
.badge.WARNING { background:var(--rev-l);color:var(--rev) }
.badge.HIGH { background:var(--bad-l);color:var(--bad) }

/* ── Tables ── */
table { width:100%;border-collapse:collapse }
th,td { padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:13px }
th { font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;background:rgba(241,245,249,0.8) }
tr:last-child td { border-bottom:0 }
tr:hover td { background:#fafcff }

/* ── Forms ── */
.form-group { margin-bottom:12px }
.form-group label { display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:6px }
.form-group input,.form-group select,.form-group textarea {
  width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;font:inherit;font-size:13px;outline:none;transition:.15s;background:#fff;
  box-shadow:inset 0 1px 2px rgba(15,23,42,0.02)
}
.form-group input:focus,.form-group select:focus { border-color:rgba(37,99,235,0.4);box-shadow:0 0 0 4px rgba(37,99,235,0.08) }
.form-group textarea { resize:vertical;min-height:72px }
.form-row { display:grid;grid-template-columns:1fr 1fr;gap:10px }

/* ── Buttons ── */
.btn { padding:10px 16px;border-radius:12px;border:0;cursor:pointer;font:600 13px 'Inter',sans-serif;transition:.15s;display:inline-flex;align-items:center;gap:6px;box-shadow:0 8px 18px rgba(15,23,42,0.04) }
.btn-primary { background:linear-gradient(135deg,var(--pri-2),var(--pri));color:#fff }
.btn-primary:hover { transform:translateY(-1px);box-shadow:0 14px 22px rgba(30,64,175,0.22) }
.btn-secondary { background:linear-gradient(180deg,#f8fbff,#eef4ff);color:var(--ink2);border:1px solid rgba(148,163,184,0.2) }
.btn-secondary:hover { background:linear-gradient(180deg,#eef4ff,#e7f0ff); }
.btn-sm { padding:7px 12px;font-size:12px }
.btn-full { width:100%;justify-content:center }
.btn-danger { background:var(--bad-l);color:var(--bad) }

/* ── Alerts ── */
.alert-item { border-left:3px solid;border-radius:6px;padding:10px 12px;margin-bottom:8px;font-size:13px }
.alert-item.HIGH { border-color:var(--bad);background:var(--bad-l) }
.alert-item.WARNING { border-color:var(--rev);background:var(--rev-l) }
.alert-item.INFO { border-color:var(--pri);background:#eff6ff }
.alert-title { font-weight:600;margin-bottom:3px }
.alert-msg { color:var(--ink2);font-size:12px }
.alert-action { font-size:11px;color:var(--mut);margin-top:4px;font-style:italic }

/* ── Ladder ── */
.ladder-row { display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line) }
.ladder-shock { width:50px;font-size:12px;font-weight:500;color:var(--ink2) }
.ladder-bar-wrap { flex:1;height:14px;background:var(--bg);border-radius:3px;overflow:hidden }
.ladder-bar { height:100%;border-radius:3px;transition:.3s }
.ladder-loss { width:60px;font-size:12px;color:var(--mut);text-align:right }
.ladder-status { width:80px;text-align:right }

/* ── Chat ── */
.chat-box { height:240px;overflow-y:auto;border:1px solid var(--line);border-radius:6px;padding:10px;background:#fafbff;margin-bottom:8px;display:flex;flex-direction:column;gap:8px }
.chat-msg { max-width:85%;padding:8px 12px;border-radius:8px;font-size:13px;line-height:1.5 }
.chat-msg.user { background:var(--pri);color:#fff;align-self:flex-end;border-radius:8px 8px 2px 8px }
.chat-msg.bot { background:#fff;border:1px solid var(--line);align-self:flex-start;border-radius:8px 8px 8px 2px }
.chat-msg.tool-trace { font-size:11px;color:var(--mut);background:transparent;border:0;padding:0 }
.chat-input-row { display:flex;gap:6px }
.chat-input-row input { flex:1;padding:8px 10px;border:1.5px solid var(--line);border-radius:6px;font:inherit;font-size:13px;outline:none }
.chat-input-row input:focus { border-color:var(--pri) }


/* ── Loading/Empty states ── */
.loading { text-align:center;padding:40px;color:var(--mut);font-size:13px }
.loading::after { content:'';display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-left:8px }
@keyframes spin { to { transform:rotate(360deg) } }
.empty { text-align:center;padding:40px;color:var(--mut);font-size:13px }

/* ── Disclaimer bar ── */
.disclaimer { background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:8px 12px;font-size:11px;color:#92400e;margin-bottom:12px }

/* ── Misc ── */
.mut { color:var(--mut) }
.text-sm { font-size:12px }
.text-xs { font-size:11px }
.fw6 { font-weight:600 }
.mt4 { margin-top:4px }
.mt8 { margin-top:8px }
.mt14 { margin-top:14px }
.flex { display:flex }
.wrap { flex-wrap:wrap }
.items-center { align-items:center }
.gap-8 { gap:8px }
.gap-14 { gap:14px }
.mb0 { margin-bottom:0 }
.flex.wrap { align-items:stretch }
.flex.wrap > .btn { flex:1 1 120px; min-width:110px; justify-content:center; text-align:center }
.page { display:none }
.page.active { display:block; animation: fadeInUp .22s ease }
@keyframes fadeInUp { from { opacity:0; transform:translateY(4px) } to { opacity:1; transform:translateY(0) } }
.two-col { display:grid;grid-template-columns:340px 1fr;gap:16px }
@media(max-width:900px){.two-col,.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}.sidebar{display:none}.main-content{margin-left:0;padding:16px}}
/* ── Highlight for warnings ── */
.warn-text { color:var(--bad);font-weight:500 }
.ok-text { color:var(--ok);font-weight:500 }
.info-text { color:var(--pri);font-weight:500 }

/* ── Section headers ── */
.section-header { display:flex;align-items:center;justify-content:space-between;margin-bottom:16px }
.section-title { font-size:18px;font-weight:600;color:var(--ink) }
.section-sub { font-size:13px;color:var(--mut);margin-top:2px }

/* ── Premium Fintech Homepage ── */
.hero-shell {
  display:grid; grid-template-columns: 1.2fr 0.8fr; gap:22px; align-items:center;
  background:linear-gradient(135deg, rgba(8,19,41,0.98), rgba(16,45,92,0.96));
  border:1px solid rgba(148,163,184,0.18); border-radius:28px; padding:28px; box-shadow:0 24px 56px rgba(2,6,23,0.18); overflow:hidden; position:relative;
}
.hero-shell::after {
  content:''; position:absolute; inset:auto -10% -55% 45%; height:220px; width:220px; border-radius:50%; background:rgba(96,165,250,0.12); filter:blur(10px);
}
.hero-copy { position:relative; z-index:1; }
.eyebrow { display:inline-flex; align-items:center; gap:8px; padding:7px 12px; border-radius:999px; background:rgba(255,255,255,0.08); color:#dbeafe; border:1px solid rgba(191,219,254,0.18); font-size:11px; text-transform:uppercase; letter-spacing:1px; font-weight:700; }
.hero-copy h1 { margin:18px 0 12px; font-size:46px; line-height:1.02; letter-spacing:-1.4px; color:#fff; font-weight:800; }
.hero-copy p { font-size:16px; color:rgba(255,255,255,0.78); max-width:560px; }
.hero-actions { display:flex; gap:12px; margin-top:22px; flex-wrap:wrap; }
.hero-actions .btn-primary { background:linear-gradient(135deg,#4f8cff,#1d4ed8); }
.hero-actions .btn-secondary { background:rgba(255,255,255,0.06); color:#fff; border:1px solid rgba(255,255,255,0.12); }
.trust-row { display:flex; gap:18px; flex-wrap:wrap; margin-top:20px; }
.trust-item { display:flex; align-items:center; gap:8px; font-size:12px; color:rgba(255,255,255,0.82); }
.trust-dot { width:8px; height:8px; background:#35d399; border-radius:50%; box-shadow:0 0 0 4px rgba(52,211,153,0.12); }
.hero-visual { position:relative; z-index:1; }
.chart-window { background:linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.06)); border:1px solid rgba(255,255,255,0.14); border-radius:24px; padding:18px; backdrop-filter:blur(12px); }
.chart-window .mini-header { display:flex; align-items:center; justify-content:space-between; color:#dbeafe; font-size:12px; margin-bottom:12px; }
.chart-graph { height:220px; border-radius:18px; background:linear-gradient(180deg, rgba(30,64,175,0.18), rgba(4,8,17,0.08)); position:relative; overflow:hidden; }
.chart-graph::before {
  content:''; position:absolute; inset:16px 14px 14px 14px; background:
    linear-gradient(to right, rgba(255,255,255,0.05), rgba(255,255,255,0.0));
  border-radius:12px;
}
.chart-graph .sparkline {
  position:absolute; inset:20px 20px 18px 18px; border-radius:12px;
  background:linear-gradient(180deg, rgba(96,165,250,0.12), rgba(255,255,255,0));
  clip-path: polygon(0% 63%, 10% 58%, 20% 65%, 30% 44%, 42% 52%, 53% 28%, 62% 35%, 76% 22%, 84% 18%, 100% 10%, 100% 100%, 0% 100%);
}
.chart-graph .sparkline::after {
  content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(96,165,250,0.18), transparent 70%);
}
.metric-badges { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
.metric-pill { display:inline-flex; align-items:center; gap:6px; padding:7px 10px; border-radius:999px; background:rgba(12,24,52,0.38); border:1px solid rgba(148,163,184,0.18); color:#dbeafe; font-size:12px; }
.metric-pill strong { color:#fff; }
.feature-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-top:16px; }
.feature-card { background:linear-gradient(180deg,#fff,#f8fbff); border:1px solid var(--line); border-radius:18px; padding:18px; box-shadow:var(--shadow-card); }
.feature-card .icon-wrap { width:42px; height:42px; border-radius:12px; background:rgba(30,64,175,0.08); color:var(--pri); display:grid; place-items:center; font-size:18px; margin-bottom:12px; }
.feature-card h3 { font-size:15px; margin-bottom:6px; }
.feature-card p { font-size:12px; color:var(--mut); line-height:1.6; }
.product-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }

const $ = id => document.getElementById(id);
const api = async (p, b, method) => {
  const opts = { headers: {'Content-Type': 'application/json'} };
  if (AUTH) opts.headers['Authorization'] = 'Bearer ' + AUTH.token;
  if (b !== undefined) { opts.method = method || 'POST'; opts.body = JSON.stringify(b); }
  const r = await fetch(p, opts);
  if (!r.ok) { const t = await r.text(); throw new Error(t); }
  return r.json();
};
const fmt = x => x == null ? 'n/a' : (+x).toLocaleString('en-IN', {maximumFractionDigits: 2});
const fmtInr = x => x == null ? 'n/a' : '₹' + Math.abs(Math.round(x)).toLocaleString('en-IN');

const prod = () => {
  const t = $('p-type')?.value || 'ELN';

};

function switchLoginTab(role) {
  ['rm','customer'].forEach(r => {
    $('tab-'+r).classList.toggle('active', r === role);
    $('demo-creds-'+r).style.display = r === role ? 'block' : 'none';
  });
  if (role === 'rm') { $('login-email').value = 'rm@finvision.demo'; $('login-password').value = 'RM@123'; }
  else { $('login-email').value = 'customer@finvision.demo'; $('login-password').value = 'Customer@123'; }
}

async function doLogin() {
  $('login-err').style.display = 'none';
  try {
    const res = await api('/api/auth/login', {email: $('login-email').value.trim(), password: $('login-password').value});
    AUTH = res;
    localStorage.setItem('fv_token', res.token);
    localStorage.setItem('fv_user', JSON.stringify(res.user));
    await bootApp();
  } catch(e) {
    $('login-err').style.display = 'block';
  }
}

async function doLogout() {
  if (AUTH) await api('/api/auth/logout', {}).catch(()=>{});
  AUTH = null;
  localStorage.removeItem('fv_token');
  localStorage.removeItem('fv_user');
  $('login-screen').style.display = 'flex';
  $('app-shell').style.display = 'none';
}

// ══════════════ BOOT ══════════════
async function bootApp() {
  $('login-screen').style.display = 'none';
  $('app-shell').style.display = 'block';
  const u = AUTH.user;
  $('top-user-name').textContent = u.name;
  $('top-role-badge').textContent = u.role === 'rm' ? 'RM' : 'Customer';
  $('top-role-badge').className = 'role-badge' + (u.role === 'customer' ? ' customer' : '');

  CUSTOMERS = await api('/api/v1/customers');

  if (u.role === 'rm') {
    buildSidebar('rm');
    buildRMPages();
    navTo('home');
    loadRMDashboard();
  } else {
    buildSidebar('customer');
    buildCustomerPages();
    SELECTED_CUSTOMER = CUSTOMERS.find(c => c.id === u.customer_id) || CUSTOMERS[0];
    navTo('cust-dashboard');
    loadCustomerDashboard();
  }
  pollAlerts();
}

async function tryAutoLogin() {
  const token = localStorage.getItem('fv_token');
  const user = localStorage.getItem('fv_user');
  if (!token || !user) return;
  AUTH = { token, user: JSON.parse(user) };
  try {
    await api('/api/auth/me');
    await bootApp();
  } catch(e) {
    AUTH = null;
    localStorage.removeItem('fv_token');
    localStorage.removeItem('fv_user');
  }
}

function setupKpiMotion() {
  document.querySelectorAll('.kpi-shell').forEach((shell) => {
    const kpi = shell.querySelector('.kpi');
    if (!kpi) return;

    let dragging = false;
    let startX = 0;
    let startY = 0;
    let offsetX = 0;
    let offsetY = 0;

    const reset = () => {
      kpi.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translate3d(0,0,0)';
      shell.classList.remove('dragging');
      dragging = false;
    };

    kpi.addEventListener('pointerdown', (event) => {
      dragging = true;
      shell.classList.add('dragging');
      startX = event.clientX;
      startY = event.clientY;
      kpi.setPointerCapture(event.pointerId);
    });

    kpi.addEventListener('pointermove', (event) => {
      const rect = kpi.getBoundingClientRect();
      const px = (event.clientX - rect.left) / rect.width - 0.5;
      const py = (event.clientY - rect.top) / rect.height - 0.5;

      if (dragging) {
        offsetX = event.clientX - startX;
        offsetY = event.clientY - startY;
        kpi.style.transform = `perspective(1000px) rotateX(${(-py * 6).toFixed(2)}deg) rotateY(${(px * 12).toFixed(2)}deg) translate3d(${offsetX * 0.18}px, ${offsetY * 0.18}px, 0)`;
        return;
      }

      kpi.style.transform = `perspective(1000px) rotateX(${(-py * 10).toFixed(2)}deg) rotateY(${(px * 12).toFixed(2)}deg) translateY(-1px)`;
    });

    kpi.addEventListener('pointerup', reset);
    kpi.addEventListener('pointerleave', () => {
      if (!dragging) reset();
    });
    kpi.addEventListener('pointercancel', reset);
  });
}

function onProductTypeChange() {
  const t = $('p-type').value;
  $('eln-fields').style.display = (t === 'ELN' || t === 'DCD') ? 'block' : 'none';
  $('cpn-fields').style.display = t === 'CPN' ? 'block' : 'none';

// ══════════════ LIVE PAYOFF ══════════════
let _liveT;
function livePayoff() {
  clearTimeout(_liveT);
  _liveT = setTimeout(async () => {
    try {
      const r = await api('/api/v1/payoff', {product: prod()});
      if (typeof Plotly !== 'undefined') drawPayoff(r.curve);
      renderScenarios(r.scenarios);
    } catch(e) {
      const el = $('payoff-chart');
      if (el) el.innerHTML = `<div class="warn-text text-sm" style="padding:16px">Chart error: ${e.message}</div>`;
    }
  }, 150);
}

function drawPayoff(c) {
  const x = c.map(p => p.move_pct), y = c.map(p => p.return_pct);
  Plotly.react('payoff-chart', [
    {x, y, mode:'lines', name:'Return %', line:{color:'#1e40af', width:2}},
    {x, y:y.map(v=>Math.min(v,0)), fill:'tozeroy', mode:'none', fillcolor:'rgba(185,28,28,.15)', name:'Loss zone'}
  ], {
    margin:{t:10,l:45,r:10,b:40},
    paper_bgcolor:'#fff', plot_bgcolor:'#fff',
    xaxis:{title:'Underlying move at maturity (%)', gridcolor:'#f0f2f7'},
    yaxis:{title:'Return on principal (%)', gridcolor:'#f0f2f7'},
    legend:{orientation:'h',y:-0.2},
    font:{family:'Inter,sans-serif',size:12}
  }, {displayModeBar:false});
}

function renderScenarios(rows) {
  const el = $('payoff-scenarios');
  if (!el || !rows) return;
  el.innerHTML = `<table>
    <tr><th>Move</th><th>Final Value</th><th>P&L %</th><th>Barrier</th></tr>
    ${rows.map(r => `<tr>
      <td>${r.move_pct > 0 ? '+' : ''}${r.move_pct}%</td>
      <td>${fmtInr(r.final_value)}</td>
      <td class="${r.pnl_pct < 0 ? 'warn-text' : 'ok-text'}">${r.pnl_pct}%</td>
      <td>${r.barrier_breached == null ? '—' : r.barrier_breached ? '<span class="warn-text">Yes</span>' : 'No'}</td>
    </tr>`).join('')}
  </table>`;
}

// ══════════════ EXTRACT ══════════════
async function extractProduct() {
  const msg = $('ex-msg');
  msg.textContent = 'Extracting…';
  try {
    let r;
    const f = $('ts-file')?.files[0];
    if (f) {
      const fd = new FormData(); fd.append('file', f);
      const res = await fetch('/api/v1/product/extract-file', {method:'POST', body:fd, headers:{Authorization:'Bearer '+AUTH?.token}});
      r = await res.json();
    } else {
      r = await api('/api/v1/product/extract-text', {text: $('ts-nl').value});
    }
    const t = r.terms || {};

    // 1. Set product type first so onProductTypeChange shows the right fields
    if (t.product_type && $('p-type')) $('p-type').value = t.product_type;
    onProductTypeChange(); // show/hide barrier, protection, participation

    // 2. Fill remaining fields
    const m = {
      'p-under':'underlying','p-tenor':'tenor_months',
      'p-coupon':'coupon_pct','p-barrier':'barrier_pct','p-strike':'strike_pct',
      'p-notional':'notional','p-prot':'protection_pct','p-part':'participation_pct'
    };
    for (const k in m) {
      if (t[m[k]] != null && $(k)) {
        $(k).value = t[m[k]];
        if (k === 'p-barrier' && $('bv')) $('bv').textContent = t[m[k]];
      }
    }

    msg.innerHTML = `<b>${r.method}</b>: ${
      r.valid
        ? '✓ Extracted — chart and scenarios updated below'
        : '⚠ Needs confirmation: ' + (r.needs_confirmation||[]).concat(r.errors||[]).join(', ')
    }`;

    // 3. Redraw payoff chart with new product
    livePayoff();
    // Auto-scroll so user can see the updated chart immediately
    setTimeout(() => $('payoff-chart')?.scrollIntoView({behavior:'smooth',block:'nearest'}), 300);

    // 4. Sync CUST_PRODUCT so customer portal pages reflect the extracted product
    CUST_PRODUCT = prod();

  } catch(e) { msg.textContent = 'Error: ' + e.message; }
}

// ══════════════ PRODUCT ACTIONS ══════════════
function applyProductConfig() {
  const p = prod();
  CUST_PRODUCT = p;  // keep customer portal in sync
  livePayoff();
  const msg = $('ex-msg');
  if (msg) msg.innerHTML = `<span class="ok-text">✓ Applied ${p.product_type} (${p.underlying}, ${p.tenor_months}m, notional ${fmtInr(p.notional)})</span>`;
  if (LAST_ASSESSMENT && SELECTED_CUSTOMER) {
    runAssessment();
  }
}

function saveProductConfig() {
  const p = prod();
  localStorage.setItem('fv_saved_prod', JSON.stringify(p));
  const msg = $('ex-msg');
  if (msg) msg.innerHTML = `<span class="ok-text">✓ Saved product configuration locally.</span>`;
  setTimeout(() => { if (msg) msg.innerHTML = ''; }, 3000);
}

function resetProductConfig() {
  $('p-type').value = 'ELN';
  $('p-under').value = 'NIFTY 50';
  $('p-tenor').value = '12';
  $('p-coupon').value = '12';
  $('p-strike').value = '100';
  $('p-notional').value = '1000000';
  if ($('p-barrier')) $('p-barrier').value = '70';
  if ($('bv')) $('bv').textContent = '70';
  if ($('p-prot')) $('p-prot').value = '90';

// ══════════════ ASSESSMENT ══════════════
async function runAssessment() {
  if (!SELECTED_CUSTOMER) { alert('Please select a customer first.'); return; }
  const resultCard = $('studio-result-card');
  const resultEl = $('studio-result');
  if (resultCard) resultCard.style.display = 'block';
  if (resultEl) resultEl.innerHTML = '<div class="loading">Running assessment</div>';

  try {
    const r = await api('/api/v1/assessment', {product: prod(), customer_id: SELECTED_CUSTOMER.id, mode: 'rm'});
    LAST_ASSESSMENT = r;
    LAST_AUDIT_ID = r.audit_id;
    // Sync CUST_PRODUCT so customer portal uses the same product the RM just assessed
    CUST_PRODUCT = prod();

    if (resultEl) resultEl.innerHTML = `
      <div class="flex items-center gap-8 mb0">${badge(r.status)} <span class="text-sm mut">Audit #${r.audit_id}</span></div>
      <div class="mt8 text-sm">${r.flags.map(f=>`<div>⚠ ${f.message}</div>`).join('')}</div>

    if (resultEl) resultEl.innerHTML = `<div class="warn-text">Error: ${e.message}</div>`;

}

  if (!el || !LAST_AUDIT_ID) return;
  el.innerHTML = `<div class="card">
    <div class="card-title">RM Justification Note</div>
    <div class="form-group mt8"><label>RM Decision</label>
      <select id="rm-decision"><option value="">— Select —</option><option>Proceed</option><option>Modify</option><option>Decline</option></select>
    </div>
    <div class="form-group"><label>RM Comments</label><textarea id="rm-comments" rows="4" placeholder="Add your assessment notes, client conversation summary, or rationale here..."></textarea></div>
    <div class="flex gap-8">
      <button class="btn btn-primary" onclick="generateRMNote()">Generate Note</button>
    </div>
    <div id="rm-note-output" class="mt14"></div>
  </div>`;
}

async function generateRMNote() {
  const el = $('rm-note-output');
  if (!el) return;
  el.innerHTML = '<div class="loading">Generating note</div>';
  try {
    const r = await api('/api/v1/rm-note', {audit_id: LAST_AUDIT_ID, rm_decision: $('rm-decision').value||null, rm_comments: $('rm-comments').value||null});
    el.innerHTML = `<div class="card" style="background:var(--bg)">
      <div class="card-title">Generated Note <button class="btn btn-secondary btn-sm" onclick="copyNote(this)">Copy</button></div>
      <pre id="rm-note-text" style="white-space:pre-wrap;font-size:12px;font-family:monospace;color:var(--ink2)">${r.note}</pre>
    </div>`;
  } catch(e) { el.textContent = 'Error: ' + e.message; }
}

function copyNote(btn) {
  const text = $('rm-note-text')?.textContent;
  if (text) { navigator.clipboard.writeText(text); btn.textContent = 'Copied!'; setTimeout(()=>btn.textContent='Copy',2000); }
}

// ══════════════ ALERTS ══════════════
async function loadAlerts(customerId) {
  const el = $('alerts-content');
  if (!el) return;
  const cid = customerId || SELECTED_CUSTOMER?.id || (AUTH?.user?.customer_id);
  if (!cid) { el.innerHTML = '<div class="empty">No customer selected.</div>'; return; }
  const r = await api(`/api/v1/customers/${cid}/alerts`).catch(()=>({alerts:[],unread_count:0}));
  if (!r.alerts?.length) { el.innerHTML = '<div class="empty">No alerts at this time.</div>'; return; }
  el.innerHTML = r.alerts.map(a=>`
    <div class="alert-item ${a.severity}">
      <div class="flex items-center gap-8">
        <div class="alert-title">${a.title}</div>
        <span class="badge ${a.severity}">${a.severity}</span>
        ${!a.is_read ? '<span class="badge INFO text-xs">NEW</span>' : ''}
      </div>
      <div class="alert-msg mt4">${a.message}</div>
      <div class="flex gap-8 mt4">
        <span class="text-xs mut">Trigger: ${a.trigger_value} | Threshold: ${a.threshold}</span>
        ${!a.is_read ? `<button class="btn btn-secondary btn-sm" onclick="markRead(${a.id},this)">Mark read</button>` : ''}
      </div>
      <div class="alert-action">${a.recommended_action}</div>
    </div>`).join('');
}

async function markRead(id, btn) {
  await api(`/api/v1/alerts/${id}/read`, {}, 'POST');
  btn.closest('.alert-item').querySelector('.badge.INFO')?.remove();
  btn.remove();
  updateAlertBadge(SELECTED_CUSTOMER?.id || AUTH?.user?.customer_id);
}

async function updateAlertBadge(customerId) {
  if (!customerId) return;
  const r = await api(`/api/v1/customers/${customerId}/alerts?unread_only=true`).catch(()=>({unread_count:0}));
  const el = $('alert-count-badge');
  if (el) {
    el.textContent = r.unread_count;
    el.style.display = r.unread_count > 0 ? 'block' : 'none';
  }
}

function pollAlerts() {
  const cid = SELECTED_CUSTOMER?.id || AUTH?.user?.customer_id;
  if (cid) updateAlertBadge(cid);
  setInterval(() => {
    const id = SELECTED_CUSTOMER?.id || AUTH?.user?.customer_id;
    if (id) updateAlertBadge(id);
  }, 30000);
}

      </div>
    `;
    // Rupee impact card
    const ri = await api('/api/v1/rupee-impact', {product: p, customer_id: c.id}).catch(()=>null);
    if (ri && $('cust-rupee-summary')) {
      $('cust-rupee-summary').innerHTML = `
        <div class="text-sm mt4" style="line-height:1.8">
          <div>💰 <b>Investment amount:</b> ${fmtInr(ri.notional)}</div>
          <div>⚠️ <b>Worst-case modelled loss:</b> <span class="warn-text"><b>${fmtInr(ri.loss_inr)}</b> (${ri.tail_loss_pct}%)</span></div>
          ${ri.months_equivalent != null ? `<div class="text-xs mut mt4">${ri.months_equivalent_text}</div>` : ''}
        </div>
      `;
    }
    // Quick scenarios
    const sc = a.scenarios || [];
    if (sc.length && $('cust-quick-scenarios')) {
      $('cust-quick-scenarios').innerHTML = `<table>
        <tr><th>If NIFTY moves</th><th>You receive</th><th>Gain / Loss</th></tr>
        ${sc.filter((_,i)=>[0,1,2,4,6].includes(i)).map(s=>`<tr>

          <td>${fmtInr(s.final_value)}</td>
          <td class="${s.pnl_pct<0?'warn-text':'ok-text'}">${s.pnl_pct>0?'+':''}${s.pnl_pct}%</td>
        </tr>`).join('')}
      </table>`;

    // Plain-language AI explanation
    const ex = await api('/api/v1/explain', {audit_id: r.audit_id, mode: 'client'}).catch(()=>null);

async function loadCustPayoff() {
  const p = CUST_PRODUCT || CUST_DEFAULT_PRODUCT;
  try {
    const r = await api('/api/v1/payoff', {product: p});
    if (typeof Plotly !== 'undefined' && $('cust-payoff-chart')) {
      const x = r.curve.map(pt=>pt.move_pct), y = r.curve.map(pt=>pt.return_pct);
      Plotly.react('cust-payoff-chart', [
        {x, y, mode:'lines', name:'Return %', line:{color:'#1e40af',width:2}},
        {x, y:y.map(v=>Math.min(v,0)), fill:'tozeroy', mode:'none', fillcolor:'rgba(185,28,28,.15)', name:'Loss zone'}
      ], {
        margin:{t:10,l:45,r:10,b:40}, paper_bgcolor:'#fff', plot_bgcolor:'#fff',
        xaxis:{title:'How much NIFTY moves at maturity (%)', gridcolor:'#f0f2f7'},
        yaxis:{title:'Return on your investment (%)', gridcolor:'#f0f2f7'},
        legend:{orientation:'h',y:-0.2}, font:{family:'Inter,sans-serif',size:12}
      }, {displayModeBar:false});
    }
    const sc = r.scenarios || [];
    if ($('cust-scenario-table')) {
      $('cust-scenario-table').innerHTML = `<table>
        <tr><th>If NIFTY moves</th><th>Your money becomes</th><th>Gain / Loss %</th><th>Gain / Loss in ₹</th><th>Barrier status</th></tr>
        ${sc.map(s=>`<tr>
          <td><b>${s.move_pct>0?'+':''}${s.move_pct}%</b></td>
          <td>${fmtInr(s.final_value)}</td>
          <td class="${s.pnl_pct<0?'warn-text':'ok-text'}">${s.pnl_pct>0?'+':''}${s.pnl_pct}%</td>
          <td class="${s.pnl<0?'warn-text':'ok-text'}">${s.pnl<0?'−':'+'}${fmtInr(Math.abs(s.pnl))}</td>
          <td>${s.barrier_breached==null?'—':s.barrier_breached?'<span class="warn-text">Breached — loss amplified</span>':'<span class="ok-text">Safe</span>'}</td>

    }
  } catch(e) {
    if($('cust-payoff-chart')) $('cust-payoff-chart').innerHTML=`<div class="warn-text">Error: ${e.message}</div>`;
  }
}

// ══════════════ CUSTOMER COPILOT ══════════════
function custAskPrompt(prompt) {
  const inp = $('cust-q');
  if (inp) inp.value = prompt;
  custAsk();
}

function formatChatMsg(text) {
  if (!text) return '';
  let clean = text.replace(/\[kb:[^\]]+\]/g, '');
  clean = clean.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  clean = clean.replace(/\*([^*]+)\*/g, '<i>$1</i>');
  clean = clean.replace(/\n\n/g, '<br><br>');
  clean = clean.replace(/\n• /g, '<br>• ');
  clean = clean.replace(/\n/g, '<br>');
  return clean;
}

function clearCustChat() {
  SESSION_CHAT_HISTORY = [];
  LAST_CUST_QUERY = '';
  const chat = $('cust-chat');
  if (chat) {
    chat.innerHTML = `
      <div class="chat-msg bot">
        👋 <b>Hello! I am your FinVision AI Assistant.</b><br><br>
        I can explain how your structured investments work in plain, everyday English with no confusing financial jargon.<br><br>
        Feel free to click any suggested question above or type your question below.
      </div>
    `;
  }
}

function retryCustLastQuestion() {
  if (LAST_CUST_QUERY) {
    const inp = $('cust-q');
    if (inp) inp.value = LAST_CUST_QUERY;
    custAsk();
  }
}

async function custAsk() {
  const q = $('cust-q').value.trim();
  if (!q) return;
  LAST_CUST_QUERY = q;
  $('cust-q').value = '';
  const chat = $('cust-chat');
  chat.innerHTML += `<div class="chat-msg user">${q}</div>`;
  chat.innerHTML += `<div class="chat-msg bot" id="bot-latest"><span class="loading" style="padding:0">Thinking...</span></div>`;
  chat.scrollTop = chat.scrollHeight;
  try {
    const cid = SELECTED_CUSTOMER?.id || AUTH?.user?.customer_id || 'C101';
    const activePage = document.querySelector('.page.active')?.id?.replace('page-', '') || 'cust-copilot';
    const pageContext = {
      view: activePage,
      customer_id: cid,
      product: LAST_ASSESSMENT?.result?.product || prod(),
      decision: LAST_ASSESSMENT?.result?.decision || null,
      breaking_point: LAST_ASSESSMENT?.result?.breaking_point?.mismatch_from_pct || null,
      portfolio_concentration: LAST_ASSESSMENT?.result?.rules?.find(r=>r.rule_id==='CONCENTRATION')?.details?.concentration_pct || null
    };

    const payload = {
      session_id: 'cust-' + (AUTH?.user?.id || 'guest'),
      message: q,
      mode: 'client',
      customer_id: cid,
      page_context: pageContext,
      history: SESSION_CHAT_HISTORY.slice(-6)
    };

    const r = await api('/api/v1/copilot', payload);
    const ansText = r.answer || '';
    $('bot-latest').innerHTML = formatChatMsg(ansText);
    $('bot-latest').id = '';

    SESSION_CHAT_HISTORY.push({role: 'user', content: q});
    SESSION_CHAT_HISTORY.push({role: 'assistant', content: ansText});
  } catch(e) {
    $('bot-latest').innerHTML = `<span class="warn-text">Error: ${e.message}</span>`;
    $('bot-latest').id = '';
  }
  chat.scrollTop = chat.scrollHeight;
}
