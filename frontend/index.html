<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FinVision — Understand Before You Invest</title>
<meta name="description" content="FinVision: Explainable structured-product suitability platform. Understand structured financial products before you invest.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>
(function(){
  function loadScript(src,cb){var s=document.createElement('script');s.src=src;s.onload=cb;s.onerror=function(){if(cb)cb();};document.head.appendChild(s);}
  loadScript('/plotly.min.js',function(){
    if(typeof Plotly==='undefined')loadScript('https://cdn.plot.ly/plotly-2.35.2.min.js',function(){window._plotlyReady=true;document.dispatchEvent(new Event('plotlyready'))});
    else{window._plotlyReady=true;document.dispatchEvent(new Event('plotlyready'));}
  });
})();
</script>
<style>
:root {
  --bg: #ecf3ff;
  --bg-2: #dfeafe;
  --surface: rgba(255,255,255,0.80);
  --card: #ffffff;
  --ink: #0d1f3d;
  --ink2: #30476d;
  --mut: #647899;
  --line: rgba(123, 144, 181, 0.22);
  --pri: #123ea6;
  --pri-2: #1d4ed8;
  --pri-3: #2563eb;
  --pri-l: #edf4ff;
  --ok: #0f766e;
  --ok-l: #dcfdf7;
  --rev: #b45309;
  --rev-l: #fff5d6;
  --bad: #b91c1c;
  --bad-l: #ffe4e6;
  --navy-900: #071a38;
  --navy-800: #0d224a;
  --navy-700: #12356a;
  --navy-100: #edf5ff;
  --panel-glow: rgba(97, 127, 255, 0.18);
  --nav-w: 230px;
  --header-h: 68px;
  --shadow-soft: 0 20px 60px rgba(11, 22, 45, 0.16);
  --shadow-card: 0 16px 32px rgba(13, 31, 61, 0.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html { scroll-behavior:smooth }
body{
  font-family:'Inter',system-ui,sans-serif;
  background:
    radial-gradient(circle at top left, rgba(37,99,235,0.18), transparent 28%),
    radial-gradient(circle at bottom right, rgba(16,185,129,0.10), transparent 26%),
    linear-gradient(180deg, #edf4ff 0%, #edf1fb 100%);
  color:var(--ink);font-size:14px;line-height:1.5
}

/* ── Login ── */
#login-screen {
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at top, rgba(255,255,255,0.18), transparent 28%), linear-gradient(135deg,#071a38 0%,#0d224a 28%,#163f9d 100%);
  padding:24px;
}
.login-box {
  background:rgba(255,255,255,0.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,0.22);border-radius:28px;padding:34px 32px;width:100%;max-width:470px;
  box-shadow:0 30px 80px rgba(2,6,23,0.38);
}
.login-logo { text-align:center;margin-bottom:22px }
.login-logo .logo-name { font-size:30px;font-weight:800;color:var(--pri);letter-spacing:-0.7px }
.login-logo .logo-tagline { font-size:13px;color:var(--mut);margin-top:4px }
.login-tabs { display:flex;gap:8px;margin-bottom:24px;padding:4px;background:#edf4ff;border-radius:12px }
.login-tab { flex:1;padding:11px 10px;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;font:600 13px 'Inter',sans-serif;color:var(--mut);transition:.18s ease }
.login-tab.active { border-color:rgba(30,64,175,0.18);color:var(--pri);background:#fff;box-shadow:0 8px 18px rgba(37,99,235,0.10) }
.login-field label { display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:7px }
.login-field input { width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;font-size:14px;outline:none;transition:.15s;background:#f7faff }
.login-field input:focus { border-color:rgba(37,99,235,0.55);box-shadow:0 0 0 4px rgba(37,99,235,0.08) }
.login-field { margin-bottom:14px }
.btn-login { width:100%;padding:14px 18px;background:linear-gradient(135deg,var(--pri-2),var(--pri));color:#fff;border:0;border-radius:12px;font:700 16px 'Inter',sans-serif;cursor:pointer;margin-top:6px;transition:.15s;box-shadow:0 16px 28px rgba(30,64,175,0.24) }
.btn-login:hover { transform:translateY(-1px); background:linear-gradient(135deg,var(--pri),var(--pri-2)) }
.demo-creds { background:linear-gradient(180deg,#f7faff,#eef5ff);border:1px solid rgba(59,130,246,0.15);border-radius:12px;padding:12px 14px;margin-top:16px;font-size:12px }
.demo-creds b { color:var(--pri);display:block;margin-bottom:6px;font-size:12px }
.demo-creds span { color:var(--mut);line-height:1.6 }
.login-err { color:var(--bad);font-size:12px;margin-top:8px;display:none;font-weight:600 }

/* ── App Shell ── */
#app-shell { display:none;min-height:100vh }
.top-bar {
  position:fixed;top:0;left:0;right:0;height:var(--header-h);z-index:100;
  background:rgba(11,20,44,0.78);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(148,163,184,0.20);box-shadow:0 8px 22px rgba(15,23,42,0.10);display:flex;align-items:center;padding:0 22px;gap:16px;
}
.top-logo { font-size:17px;font-weight:800;color:#ffffff;letter-spacing:-0.4px;flex:0 0 auto }
.top-logo span { font-weight:400;color:rgba(255,255,255,0.72);font-size:12px;display:block;line-height:1.2 }
.top-bar-right { margin-left:auto;display:flex;align-items:center;gap:12px }
.top-user { font-size:13px;color:rgba(255,255,255,0.9);display:flex;align-items:center;gap:8px }
.role-badge { font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,0.12);color:#dfe9ff;border:1px solid rgba(255,255,255,0.12) }
.role-badge.customer { background:rgba(15,118,110,0.12);color:#d7fff7;border-color:rgba(15,118,110,0.18) }
.btn-icon { background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.10);border-radius:10px;cursor:pointer;padding:7px 11px;font-size:12px;color:#edf4ff;display:flex;align-items:center;gap:4px;transition:.15s }
.btn-icon:hover { background:rgba(255,255,255,0.12) }
.alert-bell { position:relative;cursor:pointer;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.10);border-radius:10px;padding:7px 11px }
.alert-count { position:absolute;top:-6px;right:-6px;background:linear-gradient(135deg,#ff6b6b,#dc2626);color:#fff;border-radius:999px;font-size:10px;font-weight:700;padding:2px 5px;min-width:16px;text-align:center;box-shadow:0 12px 18px rgba(220,38,38,0.2) }

/* ── Nav Sidebar ── */
.sidebar {
  position:fixed;top:var(--header-h);left:0;bottom:0;width:var(--nav-w);
  background:rgba(255,255,255,0.75);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-right:1px solid var(--line);overflow-y:auto;z-index:50;padding:12px 0;
}
.nav-section-label { font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;padding:12px 18px 6px }
.nav-item { display:flex;align-items:center;gap:10px;padding:11px 16px;margin:0 10px;border-radius:12px;cursor:pointer;color:var(--ink2);transition:.18s ease;font-size:13px;border:1px solid transparent; }
.nav-item:hover { background:rgba(37,99,235,0.06);color:var(--pri);transform:translateX(2px) }
.nav-item.active { background:linear-gradient(135deg, rgba(17, 81, 206, 0.12), rgba(30,64,175,0.08));color:var(--pri);font-weight:700;border-color:rgba(30,64,175,0.15);box-shadow:inset 0 0 0 1px rgba(30,64,175,0.06) }
.nav-item .nav-icon { width:16px;text-align:center;font-size:14px }

/* ── Main Content ── */
.main-content { margin-left:var(--nav-w);margin-top:var(--header-h);padding:26px 22px 40px;min-height:calc(100vh - var(--header-h));max-width:1600px }

/* ── Cards ── */
.card { background:linear-gradient(180deg, rgba(255,255,255,0.96), rgba(247,250,255,0.92));border:1px solid rgba(148,163,184,0.18);border-radius:22px;padding:18px 18px 16px;margin-bottom:16px;box-shadow:var(--shadow-card);transition:transform .15s ease, box-shadow .15s ease }
.card:hover { transform:translateY(-1px); box-shadow:0 18px 34px rgba(13,31,61,0.09) }
.card-title { font-size:13px;font-weight:700;color:var(--ink);margin-bottom:14px;display:flex;align-items:center;gap:8px }
.card-title .badge-sm { font-size:10px;font-weight:600;padding:3px 8px;border-radius:999px }
.grid-2 { display:grid;grid-template-columns:1fr 1fr;gap:16px }
.grid-3 { display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px }
.grid-4 { display:grid;grid-template-columns:repeat(4,1fr);gap:14px }

/* ── KPI Cards ── */
.kpi-shell {
  position:relative;
  border-radius:22px;
  padding:1px;
  background:linear-gradient(135deg, rgba(59,130,246,0.25), rgba(30,64,175,0.08), rgba(148,163,184,0.15));
  box-shadow:0 18px 40px rgba(17, 24, 39, 0.06);
  animation: floatCard 7s ease-in-out infinite;
  transition:transform .22s ease, box-shadow .22s ease;
}
.kpi-shell:nth-child(2n) { animation-delay:0.7s }
.kpi-shell:nth-child(3n) { animation-delay:1.2s }
.kpi-shell:hover { transform:translateY(-3px) scale(1.01); box-shadow:0 22px 45px rgba(30,64,175,0.12) }
.kpi-shell.dragging { z-index:10 }
.kpi {
  position:relative; overflow:hidden;
  background:linear-gradient(180deg,#ffffff,#f7faff);
  border:1px solid rgba(148,163,184,0.18);
  border-radius:20px;padding:16px 18px;box-shadow:0 10px 20px rgba(15,23,42,0.03);
  cursor:grab; user-select:none; transition:transform .18s ease, box-shadow .18s ease;
}
.kpi::before {
  content:''; position:absolute; inset:-40% auto auto -25%; width:55%; height:160%;
  background:linear-gradient(120deg, rgba(255,255,255,0.30), rgba(255,255,255,0.02), rgba(255,255,255,0.00));
  transform:rotate(18deg);
}
.kpi-label { font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.6px;position:relative;z-index:1 }
.kpi-value { font-size:26px;font-weight:800;color:var(--ink);margin-top:8px;letter-spacing:-0.8px;position:relative;z-index:1 }
.kpi-sub { font-size:12px;color:var(--mut);margin-top:2px;position:relative;z-index:1 }

@keyframes floatCard {
  0%,100% { transform:translateY(0px) }
  50% { transform:translateY(-4px) }
}

/* ── Status Badges ── */
.badge { display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700 }
.badge.SUITABLE { background:var(--ok-l);color:var(--ok) }
.badge.REVIEW { background:var(--rev-l);color:var(--rev) }
.badge.MISMATCH { background:var(--bad-l);color:var(--bad) }
.badge.INFO { background:#eff6ff;color:#1d4ed8 }
.badge.WARNING { background:var(--rev-l);color:var(--rev) }
.badge.HIGH { background:var(--bad-l);color:var(--bad) }

/* ── Tables ── */
table { width:100%;border-collapse:collapse }
th,td { padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:13px }
th { font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;background:rgba(241,245,249,0.8) }
tr:last-child td { border-bottom:0 }
tr:hover td { background:#fafcff }

/* ── Forms ── */
.form-group { margin-bottom:12px }
.form-group label { display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:6px }
.form-group input,.form-group select,.form-group textarea {
  width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;font:inherit;font-size:13px;outline:none;transition:.15s;background:#fff;
  box-shadow:inset 0 1px 2px rgba(15,23,42,0.02)
}
.form-group input:focus,.form-group select:focus { border-color:rgba(37,99,235,0.4);box-shadow:0 0 0 4px rgba(37,99,235,0.08) }
.form-group textarea { resize:vertical;min-height:72px }
.form-row { display:grid;grid-template-columns:1fr 1fr;gap:10px }

/* ── Buttons ── */
.btn { padding:10px 16px;border-radius:12px;border:0;cursor:pointer;font:600 13px 'Inter',sans-serif;transition:.15s;display:inline-flex;align-items:center;gap:6px;box-shadow:0 8px 18px rgba(15,23,42,0.04) }
.btn-primary { background:linear-gradient(135deg,var(--pri-2),var(--pri));color:#fff }
.btn-primary:hover { transform:translateY(-1px);box-shadow:0 14px 22px rgba(30,64,175,0.22) }
.btn-secondary { background:linear-gradient(180deg,#f8fbff,#eef4ff);color:var(--ink2);border:1px solid rgba(148,163,184,0.2) }
.btn-secondary:hover { background:linear-gradient(180deg,#eef4ff,#e7f0ff); }
.btn-sm { padding:7px 12px;font-size:12px }
.btn-full { width:100%;justify-content:center }
.btn-danger { background:var(--bad-l);color:var(--bad) }

/* ── Alerts ── */
.alert-item { border-left:3px solid;border-radius:6px;padding:10px 12px;margin-bottom:8px;font-size:13px }
.alert-item.HIGH { border-color:var(--bad);background:var(--bad-l) }
.alert-item.WARNING { border-color:var(--rev);background:var(--rev-l) }
.alert-item.INFO { border-color:var(--pri);background:#eff6ff }
.alert-title { font-weight:600;margin-bottom:3px }
.alert-msg { color:var(--ink2);font-size:12px }
.alert-action { font-size:11px;color:var(--mut);margin-top:4px;font-style:italic }

/* ── Ladder ── */
.ladder-row { display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line) }
.ladder-shock { width:50px;font-size:12px;font-weight:500;color:var(--ink2) }
.ladder-bar-wrap { flex:1;height:14px;background:var(--bg);border-radius:3px;overflow:hidden }
.ladder-bar { height:100%;border-radius:3px;transition:.3s }
.ladder-loss { width:60px;font-size:12px;color:var(--mut);text-align:right }
.ladder-status { width:80px;text-align:right }

/* ── Chat ── */
.chat-box { height:240px;overflow-y:auto;border:1px solid var(--line);border-radius:6px;padding:10px;background:#fafbff;margin-bottom:8px;display:flex;flex-direction:column;gap:8px }
.chat-msg { max-width:85%;padding:8px 12px;border-radius:8px;font-size:13px;line-height:1.5 }
.chat-msg.user { background:var(--pri);color:#fff;align-self:flex-end;border-radius:8px 8px 2px 8px }
.chat-msg.bot { background:#fff;border:1px solid var(--line);align-self:flex-start;border-radius:8px 8px 8px 2px }
.chat-msg.tool-trace { font-size:11px;color:var(--mut);background:transparent;border:0;padding:0 }
.chat-input-row { display:flex;gap:6px }
.chat-input-row input { flex:1;padding:8px 10px;border:1.5px solid var(--line);border-radius:6px;font:inherit;font-size:13px;outline:none }
.chat-input-row input:focus { border-color:var(--pri) }


/* ── Loading/Empty states ── */
.loading { text-align:center;padding:40px;color:var(--mut);font-size:13px }
.loading::after { content:'';display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-left:8px }
@keyframes spin { to { transform:rotate(360deg) } }
.empty { text-align:center;padding:40px;color:var(--mut);font-size:13px }

/* ── Disclaimer bar ── */
.disclaimer { background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:8px 12px;font-size:11px;color:#92400e;margin-bottom:12px }

/* ── Misc ── */
.mut { color:var(--mut) }
.text-sm { font-size:12px }
.text-xs { font-size:11px }
.fw6 { font-weight:600 }
.mt4 { margin-top:4px }
.mt8 { margin-top:8px }
.mt14 { margin-top:14px }
.flex { display:flex }
.wrap { flex-wrap:wrap }
.items-center { align-items:center }
.gap-8 { gap:8px }
.gap-14 { gap:14px }
.mb0 { margin-bottom:0 }
.flex.wrap { align-items:stretch }
.flex.wrap > .btn { flex:1 1 120px; min-width:110px; justify-content:center; text-align:center }
.page { display:none }
.page.active { display:block; animation: fadeInUp .22s ease }
@keyframes fadeInUp { from { opacity:0; transform:translateY(4px) } to { opacity:1; transform:translateY(0) } }
.two-col { display:grid;grid-template-columns:340px 1fr;gap:16px }
@media(max-width:900px){.two-col,.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}.sidebar{display:none}.main-content{margin-left:0;padding:16px}}
/* ── Highlight for warnings ── */
.warn-text { color:var(--bad);font-weight:500 }
.ok-text { color:var(--ok);font-weight:500 }
.info-text { color:var(--pri);font-weight:500 }

/* ── Section headers ── */
.section-header { display:flex;align-items:center;justify-content:space-between;margin-bottom:16px }
.section-title { font-size:18px;font-weight:600;color:var(--ink) }
.section-sub { font-size:13px;color:var(--mut);margin-top:2px }

/* ── Premium Fintech Homepage ── */
.hero-shell {
  display:grid; grid-template-columns: 1.2fr 0.8fr; gap:22px; align-items:center;
  background:linear-gradient(135deg, rgba(8,19,41,0.98), rgba(16,45,92,0.96));
  border:1px solid rgba(148,163,184,0.18); border-radius:28px; padding:28px; box-shadow:0 24px 56px rgba(2,6,23,0.18); overflow:hidden; position:relative;
}
.hero-shell::after {
  content:''; position:absolute; inset:auto -10% -55% 45%; height:220px; width:220px; border-radius:50%; background:rgba(96,165,250,0.12); filter:blur(10px);
}
.hero-copy { position:relative; z-index:1; }
.eyebrow { display:inline-flex; align-items:center; gap:8px; padding:7px 12px; border-radius:999px; background:rgba(255,255,255,0.08); color:#dbeafe; border:1px solid rgba(191,219,254,0.18); font-size:11px; text-transform:uppercase; letter-spacing:1px; font-weight:700; }
.hero-copy h1 { margin:18px 0 12px; font-size:46px; line-height:1.02; letter-spacing:-1.4px; color:#fff; font-weight:800; }
.hero-copy p { font-size:16px; color:rgba(255,255,255,0.78); max-width:560px; }
.hero-actions { display:flex; gap:12px; margin-top:22px; flex-wrap:wrap; }
.hero-actions .btn-primary { background:linear-gradient(135deg,#4f8cff,#1d4ed8); }
.hero-actions .btn-secondary { background:rgba(255,255,255,0.06); color:#fff; border:1px solid rgba(255,255,255,0.12); }
.trust-row { display:flex; gap:18px; flex-wrap:wrap; margin-top:20px; }
.trust-item { display:flex; align-items:center; gap:8px; font-size:12px; color:rgba(255,255,255,0.82); }
.trust-dot { width:8px; height:8px; background:#35d399; border-radius:50%; box-shadow:0 0 0 4px rgba(52,211,153,0.12); }
.hero-visual { position:relative; z-index:1; }
.chart-window { background:linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.06)); border:1px solid rgba(255,255,255,0.14); border-radius:24px; padding:18px; backdrop-filter:blur(12px); }
.chart-window .mini-header { display:flex; align-items:center; justify-content:space-between; color:#dbeafe; font-size:12px; margin-bottom:12px; }
.chart-graph { height:220px; border-radius:18px; background:linear-gradient(180deg, rgba(30,64,175,0.18), rgba(4,8,17,0.08)); position:relative; overflow:hidden; }
.chart-graph::before {
  content:''; position:absolute; inset:16px 14px 14px 14px; background:
    linear-gradient(to right, rgba(255,255,255,0.05), rgba(255,255,255,0.0));
  border-radius:12px;
}
.chart-graph .sparkline {
  position:absolute; inset:20px 20px 18px 18px; border-radius:12px;
  background:linear-gradient(180deg, rgba(96,165,250,0.12), rgba(255,255,255,0));
  clip-path: polygon(0% 63%, 10% 58%, 20% 65%, 30% 44%, 42% 52%, 53% 28%, 62% 35%, 76% 22%, 84% 18%, 100% 10%, 100% 100%, 0% 100%);
}
.chart-graph .sparkline::after {
  content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(96,165,250,0.18), transparent 70%);
}
.metric-badges { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
.metric-pill { display:inline-flex; align-items:center; gap:6px; padding:7px 10px; border-radius:999px; background:rgba(12,24,52,0.38); border:1px solid rgba(148,163,184,0.18); color:#dbeafe; font-size:12px; }
.metric-pill strong { color:#fff; }
.feature-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-top:16px; }
.feature-card { background:linear-gradient(180deg,#fff,#f8fbff); border:1px solid var(--line); border-radius:18px; padding:18px; box-shadow:var(--shadow-card); }
.feature-card .icon-wrap { width:42px; height:42px; border-radius:12px; background:rgba(30,64,175,0.08); color:var(--pri); display:grid; place-items:center; font-size:18px; margin-bottom:12px; }
.feature-card h3 { font-size:15px; margin-bottom:6px; }
.feature-card p { font-size:12px; color:var(--mut); line-height:1.6; }
.product-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }

<script>
'use strict';
// ══════════════ GLOBALS ══════════════
let AUTH = null; // {token, user}
let CUSTOMERS = [];
let SELECTED_CUSTOMER = null;
let LAST_ASSESSMENT = null;
let LAST_AUDIT_ID = null;
let SESSION_CHAT_HISTORY = [];
let LAST_CUST_QUERY = '';

const $ = id => document.getElementById(id);
const api = async (p, b, method) => {
  const opts = { headers: {'Content-Type': 'application/json'} };
  if (AUTH) opts.headers['Authorization'] = 'Bearer ' + AUTH.token;
  if (b !== undefined) { opts.method = method || 'POST'; opts.body = JSON.stringify(b); }
  const r = await fetch(p, opts);
  if (!r.ok) { const t = await r.text(); throw new Error(t); }
  return r.json();
};
const fmt = x => x == null ? 'n/a' : (+x).toLocaleString('en-IN', {maximumFractionDigits: 2});
const fmtInr = x => x == null ? 'n/a' : '₹' + Math.abs(Math.round(x)).toLocaleString('en-IN');
const badge = s => `<span class="badge ${s}">${s}</span>`;
const prod = () => {
  const t = $('p-type')?.value || 'ELN';
  const o = {
    product_type: t,
    underlying: $('p-under')?.value || 'NIFTY 50',
    tenor_months: +($('p-tenor')?.value || 12),
    coupon_pct: +($('p-coupon')?.value || 12),
    strike_pct: +($('p-strike')?.value || 100),
    notional: +($('p-notional')?.value || 1000000),
    protection_pct: +($('p-prot')?.value || 90),
    participation_pct: +($('p-part')?.value || 100),
  };
  if (t === 'ELN' || t === 'DCD') o.barrier_pct = +($('p-barrier')?.value || 70);
  return o;
};

// ══════════════ AUTH ══════════════
function switchLoginTab(role) {
  ['rm','customer'].forEach(r => {
    $('tab-'+r).classList.toggle('active', r === role);
    $('demo-creds-'+r).style.display = r === role ? 'block' : 'none';
  });
  if (role === 'rm') { $('login-email').value = 'rm@finvision.demo'; $('login-password').value = 'RM@123'; }
  else { $('login-email').value = 'customer@finvision.demo'; $('login-password').value = 'Customer@123'; }
}

async function doLogin() {
  $('login-err').style.display = 'none';
  try {
    const res = await api('/api/auth/login', {email: $('login-email').value.trim(), password: $('login-password').value});
    AUTH = res;
    localStorage.setItem('fv_token', res.token);
    localStorage.setItem('fv_user', JSON.stringify(res.user));
    await bootApp();
  } catch(e) {
    $('login-err').style.display = 'block';
  }
}

async function doLogout() {
  if (AUTH) await api('/api/auth/logout', {}).catch(()=>{});
  AUTH = null;
  localStorage.removeItem('fv_token');
  localStorage.removeItem('fv_user');
  $('login-screen').style.display = 'flex';
  $('app-shell').style.display = 'none';
}

// ══════════════ BOOT ══════════════
async function bootApp() {
  $('login-screen').style.display = 'none';
  $('app-shell').style.display = 'block';
  const u = AUTH.user;
  $('top-user-name').textContent = u.name;
  $('top-role-badge').textContent = u.role === 'rm' ? 'RM' : 'Customer';
  $('top-role-badge').className = 'role-badge' + (u.role === 'customer' ? ' customer' : '');

  CUSTOMERS = await api('/api/v1/customers');

  if (u.role === 'rm') {
    buildSidebar('rm');
    buildRMPages();
    navTo('home');
    loadRMDashboard();
  } else {
    buildSidebar('customer');
    buildCustomerPages();
    SELECTED_CUSTOMER = CUSTOMERS.find(c => c.id === u.customer_id) || CUSTOMERS[0];
    navTo('cust-dashboard');
    loadCustomerDashboard();
  }
  pollAlerts();
}

async function tryAutoLogin() {
  const token = localStorage.getItem('fv_token');
  const user = localStorage.getItem('fv_user');
  if (!token || !user) return;
  AUTH = { token, user: JSON.parse(user) };
  try {
    await api('/api/auth/me');
    await bootApp();
  } catch(e) {
    AUTH = null;
    localStorage.removeItem('fv_token');
    localStorage.removeItem('fv_user');
  }
}

function setupKpiMotion() {
  document.querySelectorAll('.kpi-shell').forEach((shell) => {
    const kpi = shell.querySelector('.kpi');
    if (!kpi) return;

    let dragging = false;
    let startX = 0;
    let startY = 0;
    let offsetX = 0;
    let offsetY = 0;

    const reset = () => {
      kpi.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translate3d(0,0,0)';
      shell.classList.remove('dragging');
      dragging = false;
    };

    kpi.addEventListener('pointerdown', (event) => {
      dragging = true;
      shell.classList.add('dragging');
      startX = event.clientX;
      startY = event.clientY;
      kpi.setPointerCapture(event.pointerId);
    });

    kpi.addEventListener('pointermove', (event) => {
      const rect = kpi.getBoundingClientRect();
      const px = (event.clientX - rect.left) / rect.width - 0.5;
      const py = (event.clientY - rect.top) / rect.height - 0.5;

      if (dragging) {
        offsetX = event.clientX - startX;
        offsetY = event.clientY - startY;
        kpi.style.transform = `perspective(1000px) rotateX(${(-py * 6).toFixed(2)}deg) rotateY(${(px * 12).toFixed(2)}deg) translate3d(${offsetX * 0.18}px, ${offsetY * 0.18}px, 0)`;
        return;
      }

      kpi.style.transform = `perspective(1000px) rotateX(${(-py * 10).toFixed(2)}deg) rotateY(${(px * 12).toFixed(2)}deg) translateY(-1px)`;
    });

    kpi.addEventListener('pointerup', reset);
    kpi.addEventListener('pointerleave', () => {
      if (!dragging) reset();
    });
    kpi.addEventListener('pointercancel', reset);
  });
}

let _liveT;
function livePayoff() {
  clearTimeout(_liveT);
  _liveT = setTimeout(async () => {
    try {
      const r = await api('/api/v1/payoff', {product: prod()});
      if (typeof Plotly !== 'undefined') drawPayoff(r.curve);

      if (el) el.innerHTML = `<div class="warn-text text-sm" style="padding:16px">Chart error: ${e.message}</div>`;
    }

function drawPayoff(c) {
  const x = c.map(p => p.move_pct), y = c.map(p => p.return_pct);
  Plotly.react('payoff-chart', [
    {x, y, mode:'lines', name:'Return %', line:{color:'#1e40af', width:2}},
    {x, y:y.map(v=>Math.min(v,0)), fill:'tozeroy', mode:'none', fillcolor:'rgba(185,28,28,.15)', name:'Loss zone'}
  ], {
    margin:{t:10,l:45,r:10,b:40},
    paper_bgcolor:'#fff', plot_bgcolor:'#fff',
    xaxis:{title:'Underlying move at maturity (%)', gridcolor:'#f0f2f7'},
    yaxis:{title:'Return on principal (%)', gridcolor:'#f0f2f7'},
    legend:{orientation:'h',y:-0.2},
    font:{family:'Inter,sans-serif',size:12}
  }, {displayModeBar:false});
}

// ══════════════ EXTRACT ══════════════
async function extractProduct() {
  const msg = $('ex-msg');
  msg.textContent = 'Extracting…';
  try {
    let r;
    const f = $('ts-file')?.files[0];
    if (f) {
      const fd = new FormData(); fd.append('file', f);
      const res = await fetch('/api/v1/product/extract-file', {method:'POST', body:fd, headers:{Authorization:'Bearer '+AUTH?.token}});
      r = await res.json();
    } else {
      r = await api('/api/v1/product/extract-text', {text: $('ts-nl').value});
    }
    const t = r.terms || {};

    // 1. Set product type first so onProductTypeChange shows the right fields
    if (t.product_type && $('p-type')) $('p-type').value = t.product_type;
    onProductTypeChange(); // show/hide barrier, protection, participation

    // 2. Fill remaining fields
    const m = {
      'p-under':'underlying','p-tenor':'tenor_months',
      'p-coupon':'coupon_pct','p-barrier':'barrier_pct','p-strike':'strike_pct',
      'p-notional':'notional','p-prot':'protection_pct','p-part':'participation_pct'
    };
    for (const k in m) {
      if (t[m[k]] != null && $(k)) {
        $(k).value = t[m[k]];
        if (k === 'p-barrier' && $('bv')) $('bv').textContent = t[m[k]];
      }
    }

    msg.innerHTML = `<b>${r.method}</b>: ${
      r.valid
        ? '✓ Extracted — chart and scenarios updated below'
        : '⚠ Needs confirmation: ' + (r.needs_confirmation||[]).concat(r.errors||[]).join(', ')
    }`;

    // 3. Redraw payoff chart with new product
    livePayoff();
    // Auto-scroll so user can see the updated chart immediately
    setTimeout(() => $('payoff-chart')?.scrollIntoView({behavior:'smooth',block:'nearest'}), 300);

    // 4. Sync CUST_PRODUCT so customer portal pages reflect the extracted product
    CUST_PRODUCT = prod();

  } catch(e) { msg.textContent = 'Error: ' + e.message; }
}

function renderScenariosHtml(rows) {
  if (!rows) return '<div class="empty">No data</div>';
  return `<table><tr><th>Move</th><th>Final Value</th><th>P&L</th><th>Barrier</th></tr>
  ${rows.map(r=>`<tr><td>${r.move_pct>0?'+':''}${r.move_pct}%</td><td>${fmtInr(r.final_value)}</td>

// ══════════════ ALERTS & NOTIFICATIONS ══════════════
let ALL_ALERTS = [];

async function updateAlertBadge(customerId) {
  const isRm = AUTH?.user?.role === 'rm';
  const cid = isRm ? 'all' : (customerId || AUTH?.user?.customer_id || SELECTED_CUSTOMER?.id);
  if (!cid) return;
  const r = await api(`/api/v1/customers/${cid}/alerts?unread_only=true`).catch(() => ({unread_count: 0}));
  const unread = r.unread_count || 0;
  const el = $('alert-count-badge');
  if (el) {
    el.textContent = unread;
    el.style.display = unread > 0 ? 'inline-block' : 'none';
  }
  const sideEl = $('nav-alerts-badge');
  if (sideEl) {
    sideEl.textContent = unread;
    sideEl.style.display = unread > 0 ? 'inline-block' : 'none';
  }
}

function pollAlerts() {
  updateAlertBadge();
  setInterval(() => {
    updateAlertBadge();
  }, 30000);
}

async function loadAlerts(customerId) {
  const el = $('alerts-content');
  if (!el) return;
  el.innerHTML = '<div class="loading">Loading alerts...</div>';
  const isRm = AUTH?.user?.role === 'rm';
  const cid = isRm ? 'all' : (customerId || AUTH?.user?.customer_id || SELECTED_CUSTOMER?.id);
  if (!cid) { el.innerHTML = '<div class="empty">No client selected.</div>'; return; }
  
  const r = await api(`/api/v1/customers/${cid}/alerts`).catch(() => ({alerts:[], unread_count:0}));
  ALL_ALERTS = r.alerts || [];

  // Populate client filter if RM
  const filterSel = $('alerts-cust-filter');
  if (filterSel && CUSTOMERS && CUSTOMERS.length) {
    const curVal = filterSel.value;
    filterSel.innerHTML = `<option value="all">All Clients (${ALL_ALERTS.filter(a => !a.is_read).length} unread)</option>` +
      CUSTOMERS.map(c => {
        const unreadCount = ALL_ALERTS.filter(a => a.customer_id === c.id && !a.is_read).length;
        return `<option value="${c.id}">${c.name} (${c.id})${unreadCount > 0 ? ` — ${unreadCount} unread` : ''}</option>`;
      }).join('');
    if (curVal) filterSel.value = curVal;
  }

  filterAlerts();
  updateAlertBadge();
}

function filterAlerts() {
  const el = $('alerts-content');
  if (!el) return;
  const custVal = $('alerts-cust-filter')?.value || 'all';
  const sevVal = $('alerts-severity-filter')?.value || 'all';
  const statVal = $('alerts-status-filter')?.value || 'all';

  const filtered = ALL_ALERTS.filter(a => {
    const matchCust = custVal === 'all' || a.customer_id === custVal;
    const matchSev = sevVal === 'all' || a.severity === sevVal;
    const matchStat = statVal === 'all' || (statVal === 'unread' ? !a.is_read : true);
    return matchCust && matchSev && matchStat;
  });

  const unreadTotal = ALL_ALERTS.filter(a => !a.is_read).length;
  const summaryEl = $('alerts-unread-summary');
  if (summaryEl) summaryEl.textContent = `${unreadTotal} Unread Alerts`;

  if (!filtered.length) {
    el.innerHTML = '<div class="empty">No alerts found matching the criteria.</div>';
    return;
  }

  el.innerHTML = filtered.map(a => {
    const c = CUSTOMERS.find(x => x.id === a.customer_id);
    const cName = c ? `${c.name} (${c.id})` : (a.customer_id || 'System');
    return `
      <div class="alert-item ${a.severity}" style="background:#fff;border:1px solid var(--line);border-left:4px solid ${a.severity === 'HIGH' ? 'var(--bad)' : a.severity === 'WARNING' ? 'var(--rev)' : 'var(--pri)'};margin-bottom:12px;padding:14px 16px;border-radius:12px">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-8">
            <span class="badge ${a.severity}">${a.severity}</span>
            <span class="badge INFO" style="font-size:11px">👤 Client: ${cName}</span>
            ${!a.is_read ? '<span class="badge" style="background:#ef4444;color:#fff;font-size:10px">NEW UNREAD</span>' : '<span class="badge" style="background:#f1f5f9;color:#64748b;font-size:10px">Read</span>'}
          </div>
          <span class="text-xs mut">${a.ts ? new Date(a.ts).toLocaleString('en-IN') : 'Recent'}</span>
        </div>
        <div class="alert-title mt8" style="font-size:15px;color:var(--ink)">${a.title}</div>
        <div class="alert-msg mt4" style="font-size:13px;line-height:1.6">${a.message}</div>
        <div class="flex gap-14 items-center mt8 text-xs mut" style="background:var(--bg);padding:8px 12px;border-radius:8px">
          <span><b>Trigger:</b> ${a.trigger_value}</span>
          <span>|</span>
          <span><b>Threshold:</b> ${a.threshold}</span>
        </div>
        <div class="alert-action mt8" style="color:var(--ink2);font-weight:500">👉 Recommended Action: ${a.recommended_action}</div>
        <div class="flex gap-8 mt14" style="justify-content:flex-end">
          ${c ? `<button class="btn btn-secondary btn-sm" onclick="rmPickCustomer('${c.id}')">Assess Client →</button>` : ''}
          ${!a.is_read ? `<button class="btn btn-primary btn-sm" onclick="markRead(${a.id}, this)">✓ Mark as Read</button>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

async function markRead(id, btn) {
  await api(`/api/v1/alerts/${id}/read`, {}, 'POST');
  const alertObj = ALL_ALERTS.find(a => a.id === id);
  if (alertObj) alertObj.is_read = 1;
  updateAlertBadge();
  filterAlerts();
}

async function markAllAlertsRead() {
  const custVal = $('alerts-cust-filter')?.value;
  const param = (custVal && custVal !== 'all') ? `?customer_id=${custVal}` : '';
  await api(`/api/v1/alerts/mark-all-read${param}`, {}, 'POST');
  ALL_ALERTS.forEach(a => {
    if (!custVal || custVal === 'all' || a.customer_id === custVal) a.is_read = 1;
  });
  updateAlertBadge();
  filterAlerts();
}

function custAskPrompt(prompt) {

function formatChatMsg(text) {
  if (!text) return '';
  let clean = text.replace(/\[kb:[^\]]+\]/g, '');
  clean = clean.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  clean = clean.replace(/\*([^*]+)\*/g, '<i>$1</i>');
  clean = clean.replace(/\n\n/g, '<br><br>');
  clean = clean.replace(/\n• /g, '<br>• ');
  clean = clean.replace(/\n/g, '<br>');
  return clean;
}

    custAsk();
  }
}

async function custAsk() {
  const q = $('cust-q').value.trim();
  if (!q) return;
  LAST_CUST_QUERY = q;
  $('cust-q').value = '';
  const chat = $('cust-chat');
  chat.innerHTML += `<div class="chat-msg user">${q}</div>`;
  chat.innerHTML += `<div class="chat-msg bot" id="bot-latest"><span class="loading" style="padding:0">Thinking...</span></div>`;
  chat.scrollTop = chat.scrollHeight;
  try {
    const cid = SELECTED_CUSTOMER?.id || AUTH?.user?.customer_id || 'C101';
    const activePage = document.querySelector('.page.active')?.id?.replace('page-', '') || 'cust-copilot';
    const pageContext = {
      view: activePage,
      customer_id: cid,
      product: LAST_ASSESSMENT?.result?.product || prod(),
      decision: LAST_ASSESSMENT?.result?.decision || null,
      breaking_point: LAST_ASSESSMENT?.result?.breaking_point?.mismatch_from_pct || null,
      portfolio_concentration: LAST_ASSESSMENT?.result?.rules?.find(r=>r.rule_id==='CONCENTRATION')?.details?.concentration_pct || null
    };

    const payload = {
      session_id: 'cust-' + (AUTH?.user?.id || 'guest'),
      message: q,
      mode: 'client',
      customer_id: cid,
      page_context: pageContext,
      history: SESSION_CHAT_HISTORY.slice(-6)
    };

    const r = await api('/api/v1/copilot', payload);
    const ansText = r.answer || '';
    $('bot-latest').innerHTML = formatChatMsg(ansText);
    $('bot-latest').id = '';

    SESSION_CHAT_HISTORY.push({role: 'user', content: q});
    SESSION_CHAT_HISTORY.push({role: 'assistant', content: ansText});
  } catch(e) {
    $('bot-latest').innerHTML = `<span class="warn-text">Error: ${e.message}</span>`;
    $('bot-latest').id = '';
  }
  chat.scrollTop = chat.scrollHeight;
}

function formatInrWords(amount) {
  if (amount == null || isNaN(amount)) return '';
  const num = Math.abs(amount);
  if (num >= 10000000) {
    const cr = num / 10000000;
    return `₹${cr % 1 === 0 ? cr : cr.toFixed(2)} Crore${cr > 1 ? 's' : ''}`;
  } else if (num >= 100000) {
    const l = num / 100000;
    return `₹${l % 1 === 0 ? l : l.toFixed(1)} Lakh${l > 1 ? 's' : ''}`;
  } else if (num >= 1000) {
    const k = num / 1000;
    return `₹${k % 1 === 0 ? k : k.toFixed(0)}K`;
  }
  return fmtInr(amount);
}

function calculateSimulatorOutcome(params) {
  const notional = +(params.notional || 1000000);
  const movePct = +(params.movePct || 0);
  const barrierPct = +(params.barrierPct || 70);
  const couponPct = +(params.couponPct || 12);
  const tenorMonths = +(params.tenorMonths || 12);
  const strikePct = +(params.strikePct || 100);
  const protectionPct = +(params.protectionPct || 90);
  const participationPct = +(params.participationPct || 100);
  const productType = params.productType || 'ELN';
  const customer = params.customer || SELECTED_CUSTOMER;

  const t = tenorMonths / 12.0;
  const finalRet = movePct / 100.0;
  const minRet = Math.min(finalRet, 0.0);
  let finalValueFraction = 1.0;
  let barrierBreached = false;
  let couponInr = 0;
  let capitalInr = notional;
  let status = 'SUITABLE';
  let statusTitle = 'Capital Protected & Safe';
  let badgeClass = 'SUITABLE';

  if (productType === 'ELN') {
    const couponFraction = (couponPct / 100.0) * t;
    couponInr = notional * couponFraction;
    barrierBreached = (1.0 + minRet) < (barrierPct / 100.0);
    const lossCase = barrierBreached && ((1.0 + finalRet) < (strikePct / 100.0));

    if (lossCase) {
      capitalInr = notional * (1.0 + finalRet);
      finalValueFraction = (1.0 + finalRet) + couponFraction;
      status = 'MISMATCH';
      statusTitle = 'Barrier Breached — Capital at Risk';
      badgeClass = 'MISMATCH';
    } else {
      capitalInr = notional;
      finalValueFraction = 1.0 + couponFraction;
      if (movePct < 0 && movePct >= (barrierPct - 100)) {
        status = 'REVIEW';
        statusTitle = 'Near Barrier Buffer';
        badgeClass = 'REVIEW';
      } else {
        status = 'SUITABLE';
        statusTitle = '100% Principal Safe + Full Coupon';
        badgeClass = 'SUITABLE';
      }
    }
  } else if (productType === 'CPN') {
    const protFraction = protectionPct / 100.0;
    const upside = Math.max(0.0, finalRet) * (participationPct / 100.0);
    finalValueFraction = protFraction + upside;
    capitalInr = notional * protFraction;
    couponInr = notional * upside;
    status = finalValueFraction >= 1.0 ? 'SUITABLE' : 'REVIEW';
    statusTitle = finalValueFraction >= 1.0 ? 'Capital Growth' : `${protectionPct}% Floor Guaranteed`;
    badgeClass = finalValueFraction >= 1.0 ? 'SUITABLE' : 'REVIEW';
  } else if (productType === 'DCD') {
    const interestFraction = (couponPct / 100.0) * t;
    couponInr = notional * interestFraction;
    const k = strikePct / 100.0;
    if ((1.0 + finalRet) < k) {
      finalValueFraction = ((1.0 + finalRet) / k) + interestFraction;
      capitalInr = notional * ((1.0 + finalRet) / k);
      status = 'REVIEW';
      statusTitle = 'Converted to Alternate Currency';
      badgeClass = 'REVIEW';
    } else {
      finalValueFraction = 1.0 + interestFraction;
      capitalInr = notional;
      status = 'SUITABLE';
      statusTitle = 'Principal Safe + Interest Paid';
      badgeClass = 'SUITABLE';
    }
  }

  const finalValue = notional * finalValueFraction;
  const pnl = finalValue - notional;
  const pnlPct = (finalValueFraction - 1.0) * 100.0;
  const lossPct = Math.max(0.0, -pnlPct);
  const lossInr = Math.max(0.0, -pnl);

  // Bank FD Comparison (standard 7% per annum)
  const fdRate = 7.0;
  const fdValue = notional * (1.0 + (fdRate / 100.0) * t);
  const vsFdInr = finalValue - fdValue;

  // Customer Tolerance Check
  let custToleranceCheck = null;
  if (customer) {
    const lossTolerancePct = customer.loss_tolerance_pct || 10;
    const maxLossBudget = (customer.portfolio_value || notional * 2) * (lossTolerancePct / 100.0);
    const exceedsTolerance = lossPct > lossTolerancePct;
    custToleranceCheck = {
      customerName: customer.name,
      riskAppetite: customer.risk_appetite,
      lossTolerancePct,
      maxLossBudget,
      exceedsTolerance
    };
  }

  return {
    notional,
    movePct,
    barrierPct,
    couponPct,
    tenorMonths,
    strikePct,
    protectionPct,
    participationPct,
    productType,
    finalValue,
    pnl,
    pnlPct,
    lossPct,
    lossInr,
    couponInr,
    capitalInr,
    barrierBreached,
    status,
    statusTitle,
    badgeClass,
    fdValue,
    vsFdInr,
    custToleranceCheck
  };
}

function generatePlaygroundExplanation(result, customer) {
  const {
    notional, movePct, barrierPct, couponPct, tenorMonths, productType,
    finalValue, pnl, pnlPct, lossPct, lossInr, couponInr, capitalInr,
    barrierBreached, status, custToleranceCheck
  } = result;

  const dropBuffer = 100 - barrierPct; // e.g. 100 - 70 = 30% drop allowed
  const isBreached = barrierBreached;
  const isLoss = pnl < 0;

  let step1 = {};
  let step2 = {};
  let step3 = {};
  let step4 = {};

  if (productType === 'ELN') {
    if (!isBreached) {
      if (movePct >= 0) {
        step1 = {
          icon: '🛡️',
          title: 'Principal 100% Protected (Market Rose or Flat)',
          text: `The market moved by <b>${movePct >= 0 ? '+' : ''}${movePct.toFixed(1)}%</b>. Because the index stayed well above your <b>${barrierPct}% safety barrier</b> (which permits up to a <b>-${dropBuffer}% market drop</b>), your entire invested principal of <b>${fmtInr(notional)}</b> is returned to you 100% intact.`
        };
      } else {
        step1 = {
          icon: '🛡️',
          title: 'Safety Barrier Shielded Your Capital (Market Dipped)',
          text: `Even though the market declined by <b>${movePct.toFixed(1)}%</b>, it remained safely above your <b>${barrierPct}% protection barrier</b> (allowing up to <b>-${dropBuffer}% decline</b>). Your <b>${fmtInr(notional)}</b> principal is completely shielded from any capital loss.`
        };
      }
      step2 = {
        icon: '💵',
        title: 'Full Guaranteed Coupon Credited',
        text: `You earn your contractually agreed coupon of <b>${couponPct}% per annum</b> for the ${tenorMonths}-month tenor. That adds a guaranteed <b>+${fmtInr(couponInr)}</b> in income directly to your payout.`
      };
      step3 = {
        icon: '🧮',
        title: 'Step-by-Step Payout Reconciled',
        text: `Initial Investment (<b>${fmtInr(notional)}</b>) + Guaranteed Coupon (<b>+${fmtInr(couponInr)}</b>) - Capital Reduction (<b>₹0</b>) = <b>Final Payout: ${fmtInr(finalValue)}</b> (Net Gain: <span class="ok-text"><b>+${fmtInr(pnl)}</b> / +${pnlPct.toFixed(2)}%</span>).`
      };
    } else {
      step1 = {
        icon: '⚠️',
        title: 'Safety Barrier Breached — Capital Reduction Triggered',
        text: `The market plunged by <b>${movePct.toFixed(1)}%</b>, breaching your <b>${barrierPct}% safety barrier</b> (the safety threshold was -${dropBuffer}%). The downside capital shield is now deactivated, and your returned principal falls in lockstep with the market to <b>${fmtInr(capitalInr)}</b>.`
      };
      step2 = {
        icon: '💵',
        title: 'Coupon Received to Partially Soften Loss',
        text: `Despite the severe market drop, you still receive your full coupon of <b>${couponPct}% (+${fmtInr(couponInr)})</b>, which reduces your net loss from ₹${fmt(Math.abs(notional * movePct / 100))} down to <b>${fmtInr(lossInr)}</b>.`
      };
      step3 = {
        icon: '🧮',
        title: 'Step-by-Step Loss Calculation',
        text: `Reduced Capital (<b>${fmtInr(capitalInr)}</b>) + Coupon Credited (<b>+${fmtInr(couponInr)}</b>) = <b>Final Payout: ${fmtInr(finalValue)}</b> (Net Loss: <span class="warn-text"><b>-${fmtInr(lossInr)}</b> / -${lossPct.toFixed(2)}%</span>).`
      };
    }
  } else if (productType === 'CPN') {
    step1 = {
      icon: '🛡️',
      title: 'Contractual Capital Floor Defended',
      text: `This note features a <b>${result.protectionPct}% capital protection floor</b>. Even in severe crashes, the minimum capital returned cannot fall below <b>${fmtInr(capitalInr)}</b>.`
    };
    step2 = {
      icon: '📈',
      title: 'Market Participation',
      text: movePct > 0
        ? `You capture <b>${result.participationPct}%</b> of the market rally (+${movePct.toFixed(1)}%), generating <b>+${fmtInr(couponInr)}</b> in additional upside return.`
        : `Since the market was flat or negative (${movePct.toFixed(1)}%), no upside participation is paid, but your capital floor remains defended.`
    };
    step3 = {
      icon: '🧮',
      title: 'Total Maturity Payout',
      text: `Protected Principal (<b>${fmtInr(capitalInr)}</b>) + Participation Bonus (<b>+${fmtInr(couponInr)}</b>) = <b>Final Payout: ${fmtInr(finalValue)}</b>.`
    };
  } else if (productType === 'DCD') {
    step1 = {
      icon: '🔄',
      title: 'Currency Conversion Evaluation',
      text: movePct < 0
        ? `The currency moved below strike level. Your deposit is converted into the alternate currency at the agreed strike rate, resulting in a market-adjusted value of <b>${fmtInr(capitalInr)}</b>.`
        : `The underlying currency remained at or above strike level. Your original principal of <b>${fmtInr(notional)}</b> is returned in your base currency.`
    };
    step2 = {
      icon: '💵',
      title: 'High Premium Yield Paid',
      text: `You receive the enhanced yield of <b>${couponPct}% per annum</b> amounting to <b>+${fmtInr(couponInr)}</b>.`
    };
    step3 = {
      icon: '🧮',
      title: 'Net Maturity Value',
      text: `Principal/Converted Base (<b>${fmtInr(capitalInr)}</b>) + Yield (<b>+${fmtInr(couponInr)}</b>) = <b>Final Payout: ${fmtInr(finalValue)}</b>.`
    };
  }

  // Step 4: Personal Profile Suitability
  if (custToleranceCheck) {
    const cName = customer ? customer.name : 'Investor';
    const cRisk = (customer ? customer.risk_appetite : 'moderate').toUpperCase();
    if (custToleranceCheck.exceedsTolerance) {
      step4 = {
        icon: '⚠️',
        title: `Suitability Warning for ${cName} (${cRisk} Profile)`,
        text: `In this scenario, your potential loss of <b>${fmtInr(lossInr)} (${lossPct.toFixed(1)}%)</b> EXCEEDS your stated loss tolerance of <b>${custToleranceCheck.lossTolerancePct}%</b> (max comfortable loss: ${fmtInr(custToleranceCheck.maxLossBudget)}). If you want lower downside risk, consider choosing a lower barrier (e.g. 60% instead of ${barrierPct}%) or reducing your ticket size from ${fmtInr(notional)}.`
      };
    } else {
      step4 = {
        icon: '✅',
        title: `Suitability Fit for ${cName} (${cRisk} Profile)`,
        text: `This outcome is fully within your safe risk budget. Your loss tolerance is <b>${custToleranceCheck.lossTolerancePct}%</b>, and under this scenario your net loss is <b>${lossPct.toFixed(1)}% (${fmtInr(lossInr)})</b>, leaving your broader wealth intact.`
      };
    }
  } else {
    step4 = {
      icon: '💡',
      title: 'Key Takeaway for Investors',
      text: isLoss
        ? `This scenario models an adverse market condition. Ensure that your overall asset allocation has adequate debt and cash reserves to comfortably absorb this potential loss.`
        : `This product offers attractive fixed yield (${couponPct}% p.a.) as long as the market avoids drops steeper than -${dropBuffer}%.`
    };
  }

  return [step1, step2, step3, step4];
}

  if (!$('dash-sim-amount')) return;
  updateDashSim();
}

function onDashSimAmountChange(val) {
  DASH_SIM_STATE.notional = +val;
  if ($('dash-sim-amount-badge')) $('dash-sim-amount-badge').textContent = formatInrWords(+val);

  if ($('dash-sim-amount')) $('dash-sim-amount').value = amt;
  onDashSimAmountChange(amt);
}

function onDashSimMoveChange(val) {
  DASH_SIM_STATE.movePct = +val;
  const num = +val;
  const badgeEl = $('dash-sim-move-badge');
  if (badgeEl) {
    badgeEl.textContent = `${num > 0 ? '+' : ''}${num.toFixed(1)}% (${num < -30 ? 'Breach' : num < 0 ? 'Dip' : num === 0 ? 'Flat' : 'Bull'})`;

    badgeEl.style.color = num < -30 ? 'var(--bad)' : num < 0 ? 'var(--rev)' : '#047857';

function setDashSimMove(movePct) {
  DASH_SIM_STATE.movePct = +movePct;
  if ($('dash-sim-move')) $('dash-sim-move').value = movePct;
  onDashSimMoveChange(movePct);
  // Highlight button
  document.querySelectorAll('#page-cust-dashboard .scenario-btn').forEach(b => b.classList.remove('active'));
  const btn = $('scen-dash-' + movePct);
  if (btn) btn.classList.add('active');
}

function updateDashSim() {
  const c = SELECTED_CUSTOMER;
  const res = calculateSimulatorOutcome({
    notional: DASH_SIM_STATE.notional,
    movePct: DASH_SIM_STATE.movePct,
    customer: c
  });

  // Render 4 KPI tiles
  const resultsEl = $('dash-sim-results');
  if (resultsEl) {
    const isGain = res.pnl >= 0;
    resultsEl.innerHTML = `
      <div class="sim-stat-tile">
        <div class="label">Investment Amount</div>
        <div class="val">${fmtInr(res.notional)}</div>
        <div class="text-xs mut mt4">${formatInrWords(res.notional)}</div>
      </div>
      <div class="sim-stat-tile">
        <div class="label">Estimated Payout</div>
        <div class="val">${fmtInr(res.finalValue)}</div>
        <div class="text-xs mut mt4">At 12-month maturity</div>
      </div>
      <div class="sim-stat-tile">
        <div class="label">Net Gain / Loss</div>
        <div class="val" style="color:${isGain ? '#0f766e' : '#b91c1c'}">
          ${isGain ? '+' : '−'}${fmtInr(Math.abs(res.pnl))}
        </div>
        <div class="text-xs fw6 mt4" style="color:${isGain ? '#0f766e' : '#b91c1c'}">
          ${isGain ? '+' : ''}${res.pnlPct.toFixed(1)}%
        </div>
      </div>
      <div class="sim-stat-tile">
        <div class="label">Protection Status</div>
        <div class="val" style="font-size:16px;margin-top:6px">${res.statusTitle}</div>
        <div class="text-xs mt4">${badge(res.badgeClass)}</div>
      </div>
    `;
  }

  // Render Explanation
  const explEl = $('dash-sim-explanation');
  if (explEl) {
    const steps = generatePlaygroundExplanation(res, c);
    explEl.innerHTML = `
      <div style="font-size:13px;font-weight:700;color:var(--ink);margin-bottom:10px;display:flex;align-items:center;gap:6px">
        🧠 What happens to your ${formatInrWords(res.notional)} in this scenario?
      </div>
      <div style="font-size:13px;line-height:1.65;color:var(--ink2)">
        <p style="margin-bottom:8px">${steps[0].text}</p>
        <p style="margin-bottom:8px">${steps[1].text}</p>
        <div style="background:#f1f5f9;padding:10px 12px;border-radius:10px;margin-top:8px">
          ${steps[2].text}
        </div>
        <div class="mt8 text-xs mut">
          ${steps[3].text}
        </div>
      </div>
    `;
  }
}

function updatePlayground() {
  if (!$('play-hero-payout')) return;
  const c = SELECTED_CUSTOMER;
  PLAY_STATE.barrierPct = +($('play-barrier')?.value || 70);
  PLAY_STATE.couponPct = +($('play-coupon')?.value || 12);
  PLAY_STATE.tenorMonths = +($('play-tenor')?.value || 12);
  PLAY_STATE.productType = $('play-ptype')?.value || 'ELN';

  const res = calculateSimulatorOutcome({
    ...PLAY_STATE,
    customer: c
  });

  const isGain = res.pnl >= 0;

  // Hero Card
  $('play-hero-payout').textContent = fmtInr(res.finalValue);
  $('play-hero-sub').textContent = `On initial investment of ${fmtInr(res.notional)} (${formatInrWords(res.notional)})`;
  $('play-hero-pnl').textContent = `${isGain ? '+' : '−'}${fmtInr(Math.abs(res.pnl))} (${isGain ? '+' : ''}${res.pnlPct.toFixed(1)}%)`;
  $('play-hero-pnl').style.color = isGain ? '#34d399' : '#f87171';
  $('play-hero-badge').textContent = res.statusTitle;
  $('play-hero-badge').className = `badge ${res.badgeClass}`;

  // Risk Meter Pin
  const pinPos = Math.max(5, Math.min(95, ((res.movePct + 60) / 100) * 100));
  const pinEl = $('play-meter-pin');
  if (pinEl) pinEl.style.left = `${pinPos}%`;

  // FD Comparison
  const fdEl = $('play-fd-comparison');
  if (fdEl) {
    const isAheadOfFd = res.vsFdInr >= 0;
    fdEl.innerHTML = `
      <span>Compared to 7.0% Bank Fixed Deposit (${fmtInr(res.fdValue)}):</span>
      <b style="color:${isAheadOfFd ? '#34d399' : '#f87171'}">
        ${isAheadOfFd ? '+' : '−'}${fmtInr(Math.abs(res.vsFdInr))} ${isAheadOfFd ? 'Outperformance' : 'Lower'}
      </b>
    `;
  }

  // Breakdown grid
  $('play-tile-principal').textContent = fmtInr(res.capitalInr);
  $('play-tile-principal-sub').textContent = res.barrierBreached ? '⚠️ Barrier Breached' : '100% Safe';
  $('play-tile-coupon').textContent = `+${fmtInr(res.couponInr)}`;
  $('play-tile-coupon-sub').textContent = `${res.couponPct}% p.a. for ${res.tenorMonths}m`;
  $('play-tile-risk').textContent = res.lossInr > 0 ? `-${fmtInr(res.lossInr)}` : '₹0';
  $('play-tile-risk').style.color = res.lossInr > 0 ? 'var(--bad)' : 'var(--ok)';

  // Customer Profile Card
  const profCard = $('play-cust-profile-card');
  if (profCard && c) {
    const check = res.custToleranceCheck;
    profCard.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <b>${c.name}</b> &nbsp;|&nbsp; Risk Profile: <span class="badge INFO">${c.risk_appetite}</span>

          : `<span class="ok-text">✅ <b>Safe Risk Match:</b> This scenario outcome fits comfortably within your ${c.loss_tolerance_pct}% loss tolerance.</span>`
        }
      </div>
    `;
  }

  // Explanation steps
  const stepsEl = $('play-explanation-steps');
  if (stepsEl) {
    const steps = generatePlaygroundExplanation(res, c);
    stepsEl.innerHTML = steps.map(s => `

function onCustPayoffAmtChange(val) {
  CUST_PAYOFF_NOTIONAL = +val;
  if ($('cust-payoff-amt-display')) $('cust-payoff-amt-display').textContent = formatInrWords(+val);
  document.querySelectorAll('#page-cust-payoff .preset-chip').forEach(c => c.classList.remove('active'));
  const match = $('chip-payoff-' + val);
  if (match) match.classList.add('active');
  renderCustPayoffTable();
}

function setPayoffAmt(amt) {
  CUST_PAYOFF_NOTIONAL = +amt;
  if ($('cust-payoff-amt-slider')) $('cust-payoff-amt-slider').value = amt;
  onCustPayoffAmtChange(amt);
}

function renderCustPayoffTable() {
  const p = CUST_PRODUCT || CUST_DEFAULT_PRODUCT;
  const notional = CUST_PAYOFF_NOTIONAL || 1000000;
  const moves = [20, 10, 0, -10, -20, -28, -32, -40];
  const rows = moves.map(m => {
    const res = calculateSimulatorOutcome({
      notional,
      movePct: m,
      barrierPct: p.barrier_pct || 70,
      couponPct: p.coupon_pct || 12,
      tenorMonths: p.tenor_months || 12,
      productType: p.product_type || 'ELN'
    });
    return {
      move_pct: m,
      final_value: res.finalValue,
      pnl: res.pnl,
      pnl_pct: res.pnlPct,
      barrier_breached: res.barrierBreached
    };
  });

  if ($('cust-scenario-table')) {
    $('cust-scenario-table').innerHTML = `<table>
      <tr><th>If NIFTY moves</th><th>Your money becomes</th><th>Gain / Loss %</th><th>Gain / Loss in ₹</th><th>Barrier status</th></tr>
      ${rows.map(s => `<tr>
        <td><b>${s.move_pct > 0 ? '+' : ''}${s.move_pct}%</b></td>
        <td>${fmtInr(s.final_value)}</td>
        <td class="${s.pnl_pct < 0 ? 'warn-text' : 'ok-text'}">${s.pnl_pct > 0 ? '+' : ''}${s.pnl_pct.toFixed(1)}%</td>
        <td class="${s.pnl < 0 ? 'warn-text' : 'ok-text'}">${s.pnl < 0 ? '−' : '+'}${fmtInr(Math.abs(s.pnl))}</td>
        <td>${s.barrier_breached ? '<span class="warn-text">Breached — loss applied</span>' : '<span class="ok-text">Protected</span>'}</td>
      </tr>`).join('')}
    </table>
    <div class="text-xs mut mt8">All calculations dynamically update based on your desired investment of ${formatInrWords(notional)} (${fmtInr(notional)}). Barrier is set at ${p.barrier_pct || 70}%.</div>
    `;
  }

  // Explanation below payoff table
  const payoffExplEl = $('cust-payoff-explanation');
  if (payoffExplEl) {
    const barrier = p.barrier_pct || 70;
    const maxDrop = 100 - barrier;
    payoffExplEl.innerHTML = `
      <div style="font-weight:700;font-size:13px;color:var(--pri);margin-bottom:6px">
        💡 How to read this table for ${formatInrWords(notional)}:
      </div>
      <div class="text-sm" style="line-height:1.65;color:var(--ink2)">
        • <b>Above -${maxDrop}% market fall:</b> You get 100% of your ${fmtInr(notional)} back PLUS your ${(p.coupon_pct || 12)}% coupon (+${fmtInr(notional * (p.coupon_pct || 12) / 100)}). Total payout: <b>${fmtInr(notional * (1 + (p.coupon_pct || 12) / 100))}</b>.<br>
        • <b>Below -${maxDrop}% market fall:</b> The safety barrier breaches. You receive your coupon, but absorb the market drop on your principal.
      </div>
    `;
  }
}

async function submitAddCustomer() {
  const id = $('add-cust-id')?.value.trim();
  const name = $('add-cust-name')?.value.trim();
  const risk_appetite = $('add-cust-risk')?.value;
  const loss_tolerance_pct = +($('add-cust-loss-tol')?.value || 15);
  const horizon_months = +($('add-cust-horizon')?.value || 36);
  const portfolio_value = +($('add-cust-portfolio')?.value || 10000000);
  const segment = $('add-cust-segment')?.value || 'HNI';
  const city = $('add-cust-city')?.value.trim() || 'Mumbai';
  const email = $('add-cust-email')?.value.trim() || `${id.toLowerCase()}@finvision.demo`;
  const phone = $('add-cust-phone')?.value.trim() || '+91-98765-00000';

  if (!id || !name) {
    alert('Please enter Client ID and Name');
    return;
  }

  const newCust = {
    id, name, risk_appetite, loss_tolerance_pct, horizon_months, portfolio_value,
    segment, city, email, phone,
    kyc_status: 'verified',
    pan: 'ABCDE' + Math.floor(1000 + Math.random()*9000) + 'F',
    rm_id: 'RM001',
    existing_exposures: { 'NIFTY 50': 20 },
    annual_income_inr: Math.round(portfolio_value * 0.25),
    liquidity_need: 'medium',
    holdings: [
      { asset: `${name.split(' ')[0]} LargeCap Equity`, underlying: 'NIFTY 50', value: portfolio_value * 0.4, type: 'equity' },
      { asset: 'Fixed Return Debentures', underlying: 'debt', value: portfolio_value * 0.35, type: 'debt' },
      { asset: 'Liquid Reserve', underlying: 'cash', value: portfolio_value * 0.25, type: 'cash' }
    ]
  };

  try {
    await api('/api/v1/customers', newCust, 'POST');
  } catch(e) {
    // Save locally
  }

  const existingIdx = CUSTOMERS.findIndex(c => c.id === id);
  if (existingIdx >= 0) CUSTOMERS[existingIdx] = newCust;
  else CUSTOMERS.push(newCust);

  closeAddCustomerModal();
  loadRMCustomers();
}

function filterProducts() {
  const risk = $('prod-filter-risk')?.value || 'all';
  const amt = $('prod-filter-amount')?.value || 'all';
  const tenor = $('prod-filter-tenor')?.value || 'all';
  const ret = $('prod-filter-return')?.value || 'all';
  const cat = $('prod-filter-category')?.value || 'all';

  const filtered = PRODUCTS.filter(p => {
    const matchRisk = risk === 'all' || p.risk.toLowerCase() === risk.toLowerCase();
    const matchCat = cat === 'all' || p.category.toLowerCase().includes(cat.toLowerCase());

    let matchAmt = true;
    if (amt === '1-10') matchAmt = p.notional >= 100000 && p.notional <= 1000000;
    else if (amt === '10-25') matchAmt = p.notional >= 1000000 && p.notional <= 2500000;
    else if (amt === '25-50') matchAmt = p.notional >= 2500000 && p.notional <= 5000000;
    else if (amt === '50+') matchAmt = p.notional >= 5000000;

    let matchTenor = true;
    if (tenor === '1-3') matchTenor = p.tenor_months >= 12 && p.tenor_months <= 36;
    else if (tenor === '3-5') matchTenor = p.tenor_months > 36 && p.tenor_months <= 60;
    else if (tenor === '5+') matchTenor = p.tenor_months > 60;

    let matchRet = true;
    if (ret === '6-10') matchRet = p.return_num >= 6 && p.return_num <= 10;
    else if (ret === '10-14') matchRet = p.return_num > 10 && p.return_num <= 14;
    else if (ret === '14+') matchRet = p.return_num > 14;

    return matchRisk && matchCat && matchAmt && matchTenor && matchRet;
  });

  renderProducts(filtered);
}

function runRMSimulation() {
  if (!$('sim-hero-payout')) return;

  const notional = +($('sim-notional')?.value || 1000000);
  const tenorMonths = +($('sim-tenor')?.value || 12);
  const couponPct = +($('sim-coupon')?.value || 12);
  const barrierPct = +($('sim-barrier')?.value || 70);
  const protPct = +($('sim-prot')?.value || 95);
  const partPct = +($('sim-part')?.value || 100);
  const movePct = +($('sim-move-slider')?.value || -10);
  const ptype = $('sim-ptype')?.value || 'ELN';
  const underlying = $('sim-underlying')?.value || 'NIFTY 50';

  RM_SIM_STATE = {
    ...RM_SIM_STATE,
    notional, tenorMonths, couponPct, barrierPct,
    protectionPct: protPct, participationPct: partPct,
    movePct, productType: ptype, underlying
  };

  const targetCust = RM_SIM_STATE.customerId && RM_SIM_STATE.customerId !== 'generic'
    ? CUSTOMERS.find(x => x.id === RM_SIM_STATE.customerId)
    : null;

  const res = calculateSimulatorOutcome({
    ...RM_SIM_STATE,
    customer: targetCust
  });

  const isGain = res.pnl >= 0;

  // Hero box
  $('sim-hero-payout').textContent = fmtInr(res.finalValue);
  $('sim-hero-sub').textContent = `On initial capital of ${fmtInr(res.notional)} (${formatInrWords(res.notional)})`;
  $('sim-hero-pnl').textContent = `${isGain ? '+' : '−'}${fmtInr(Math.abs(res.pnl))} (${isGain ? '+' : ''}${res.pnlPct.toFixed(1)}%)`;
  $('sim-hero-pnl').style.color = isGain ? '#34d399' : '#f87171';
  $('sim-hero-badge').textContent = res.statusTitle;
  $('sim-hero-badge').className = `badge ${res.badgeClass}`;

  // 4 Stats
  if ($('sim-stat-initial')) $('sim-stat-initial').textContent = fmtInr(res.notional);
  if ($('sim-stat-capital')) $('sim-stat-capital').textContent = fmtInr(res.capitalInr);
  if ($('sim-stat-coupon')) $('sim-stat-coupon').textContent = `${fmtInr(res.couponInr)} (${(couponPct * (tenorMonths/12)).toFixed(1)}%)`;
  if ($('sim-stat-drawdown')) {
    const loss = res.notional - res.capitalInr;
    $('sim-stat-drawdown').textContent = loss > 0 ? `-${fmtInr(loss)} (-${((loss/res.notional)*100).toFixed(1)}%)` : '₹0 (Safe)';
    $('sim-stat-drawdown').style.color = loss > 0 ? 'var(--bad)' : 'var(--ok)';
  }

  // Mandate compliance card
  const mandateEl = $('sim-mandate-card');
  const mandateText = $('sim-mandate-text');
  if (mandateEl && mandateText) {
    if (targetCust) {
      const lossPct = Math.max(0, -res.pnlPct);
      const isBreached = lossPct > targetCust.loss_tolerance_pct;
      mandateEl.style.display = 'block';
      mandateEl.style.background = isBreached ? '#fef2f2' : '#f0fdf4';
      mandateEl.style.borderColor = isBreached ? '#fecaca' : '#bbf7d0';
      mandateText.innerHTML = isBreached
        ? `❌ <b style="color:var(--bad)">Mandate Breach Warning:</b> Under this -${Math.abs(movePct)}% move, the modeled loss is <b>${lossPct.toFixed(1)}%</b>, which EXCEEDS ${targetCust.name}'s max loss tolerance of <b>${targetCust.loss_tolerance_pct}%</b>.`
        : `✅ <b class="ok-text">Mandate Compliant:</b> Under this move, net outcome is <b>${res.pnlPct >= 0 ? '+' : ''}${res.pnlPct.toFixed(1)}%</b>, fully within ${targetCust.name}'s ${targetCust.loss_tolerance_pct}% tolerance limit.`;
    } else {
      mandateEl.style.display = 'block';
      mandateEl.style.background = '#f8fafc';
      mandateEl.style.borderColor = 'var(--line)';
      mandateText.innerHTML = `ℹ️ <b>Market Scenario Info:</b> Barrier at ${barrierPct}%. Market falls up to ${100 - barrierPct}% are 100% capital protected with full coupon.`;
    }
  }

  // Chart
  renderSimPayoffChart(RM_SIM_STATE, res);

  // Scenario Table
  renderSimScenarioTable(RM_SIM_STATE, res);

  // Narrative
  renderSimNarrative(RM_SIM_STATE, res, targetCust);
}

function renderSimPayoffChart(state, currentRes) {
  const chartEl = $('sim-payoff-chart');
  if (!chartEl) return;

  const points = [];
  const moves = [-60, -50, -40, -30, -25, -20, -15, -10, -5, 0, 5, 10, 15, 20, 30, 40, 50, 60];
  moves.forEach(m => {
    const o = calculateSimulatorOutcome({ ...state, movePct: m });
    points.push({ x: m, y: o.pnlPct });
  });

  if (typeof Plotly !== 'undefined') {
    const x = points.map(p => p.x);
    const y = points.map(p => p.y);
    const barrierDrop = -(100 - state.barrierPct);

    const traces = [
      {
        x, y, mode: 'lines', name: 'Payoff %',
        line: { color: '#1d4ed8', width: 3 }
      },
      {
        x, y: y.map(v => Math.min(v, 0)), mode: 'none', fill: 'tozeroy',
        fillcolor: 'rgba(239, 68, 68, 0.15)', name: 'Capital Loss Zone'
      },
      {
        x: [state.movePct], y: [currentRes.pnlPct], mode: 'markers+text',
        name: 'Current Scenario',
        text: [`${state.movePct}% (${currentRes.pnlPct > 0 ? '+' : ''}${currentRes.pnlPct.toFixed(1)}%)`],
        textposition: 'top center',
        marker: { size: 12, color: currentRes.pnl >= 0 ? '#10b981' : '#ef4444', line: { color: '#ffffff', width: 2 } }
      }
    ];

    const shapes = state.productType === 'ELN' ? [{
      type: 'line', x0: barrierDrop, x1: barrierDrop, y0: -60, y1: 40,
      line: { color: '#ef4444', width: 1.5, dash: 'dot' }
    }] : [];

    Plotly.react('sim-payoff-chart', traces, {
      margin: { t: 15, l: 45, r: 15, b: 35 },
      paper_bgcolor: '#ffffff', plot_bgcolor: '#ffffff',
      xaxis: { title: 'Underlying Market Movement (%)', gridcolor: '#f1f5f9', zerolinecolor: '#cbd5e1' },
      yaxis: { title: 'Net Return (%)', gridcolor: '#f1f5f9', zerolinecolor: '#cbd5e1' },
      shapes,
      showlegend: false,
      font: { family: 'Inter, system-ui, sans-serif', size: 11 }
    }, { displayModeBar: false, responsive: true });
  } else {
    // Fallback SVG representation
    chartEl.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--pri);font-weight:600">
        Deterministic Payoff: At ${state.movePct}% move → Payout: ${fmtInr(currentRes.finalValue)} (${currentRes.pnlPct.toFixed(1)}%)
      </div>
    `;
  }
}

function renderSimScenarioTable(state, currentRes) {
  const el = $('sim-scenario-table');
  if (!el) return;

  const scenarios = [-50, -40, -30, -20, -10, 0, 15, 30];
  const rows = scenarios.map(m => {
    const o = calculateSimulatorOutcome({ ...state, movePct: m });
    const isActive = Math.round(state.movePct) === m;
    return `
      <tr style="${isActive ? 'background:#e0f2fe;font-weight:700' : ''}">
        <td><span class="badge ${m < 0 ? (m <= -30 ? 'MISMATCH' : 'REVIEW') : 'SUITABLE'}">${m > 0 ? '+' : ''}${m}%</span></td>
        <td><b>${fmtInr(o.finalValue)}</b></td>
        <td style="color:${o.pnl >= 0 ? 'var(--ok)' : 'var(--bad)'}">${o.pnl >= 0 ? '+' : '−'}${fmtInr(Math.abs(o.pnl))}</td>
        <td style="color:${o.pnlPct >= 0 ? 'var(--ok)' : 'var(--bad)'}">${o.pnlPct >= 0 ? '+' : ''}${o.pnlPct.toFixed(1)}%</td>
        <td>${fmtInr(o.capitalInr)}</td>
        <td>${fmtInr(o.couponInr)}</td>
        <td><span class="badge ${o.badgeClass}">${o.statusTitle}</span></td>
      </tr>
    `;
  }).join('');

  el.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Market Move</th>
          <th>Total Maturity Payout</th>
          <th>Net P&L (₹)</th>
          <th>Net Return (%)</th>
          <th>Principal Returned</th>
          <th>Coupon Paid</th>
          <th>Engine Status</th>
        </tr>
      </thead>
      <tbody>
        ${rows}
      </tbody>
    </table>
  `;
}

function renderSimNarrative(state, res, customer) {
  const el = $('sim-narrative-explanation');
  if (!el) return;

  const barrier = state.barrierPct;
  const maxDrop = 100 - barrier;
  const notional = state.notional;
  const coupon = state.couponPct;

  let narrative = '';
  if (state.productType === 'ELN') {
    if (res.barrierBreached) {
      narrative = `
        Under this adverse market crash of <b>${state.movePct}%</b>, the underlying asset breaches the <b>${barrier}% barrier</b> (tolerance buffer was -${maxDrop}%).
        As per deterministic payoff terms, the safety barrier knocks in: you receive the guaranteed coupon of <b>${fmtInr(res.couponInr)}</b>, but absorb the <b>${Math.abs(state.movePct)}% drop</b> on your principal.
        Total proceeds returned: <b>${fmtInr(res.finalValue)}</b> (capital loss: <b style="color:var(--bad)">${fmtInr(res.lossInr)}</b>).
      `;
    } else {
      narrative = `
        At a market movement of <b>${state.movePct > 0 ? '+' : ''}${state.movePct}%</b>, the index remains safely above the <b>${barrier}% protection barrier</b> (-${maxDrop}% max buffer).
        Your principal is <b>100% safeguarded</b>: you receive your full <b>${fmtInr(notional)}</b> capital PLUS <b>${fmtInr(res.couponInr)}</b> in coupon income (${coupon}% p.a.), generating a total return of <b class="ok-text">${fmtInr(res.finalValue)}</b> (+${res.pnlPct.toFixed(1)}%).
      `;
    }
  } else if (state.productType === 'CPN') {
    narrative = `
      This Capital Protected Note guarantees <b>${state.protectionPct}% principal safety</b> (${fmtInr(notional * state.protectionPct / 100)} floor) with <b>${state.participationPct}% upside participation</b>.
      At <b>${state.movePct > 0 ? '+' : ''}${state.movePct}% move</b>, your guaranteed return is <b class="${res.pnl >= 0 ? 'ok-text' : ''}">${fmtInr(res.finalValue)}</b>.
    `;
  } else {
    narrative = `
      This Dual Currency Deposit yields <b>${coupon}% annualized interest</b> (${fmtInr(res.couponInr)}).
      At <b>${state.movePct > 0 ? '+' : ''}${state.movePct}%</b> FX shift, your maturity payout is <b>${fmtInr(res.finalValue)}</b>.
    `;
  }

  el.innerHTML = narrative;
}
